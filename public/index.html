<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm Commander - AuDHD Edition v3.0-NEUROCHECK</title>
    <!-- VERSION: 3.0-NEUROCHECK - If you see this, new code loaded! -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        console.log('%c🎯 CALM COMMANDER v3.0-NEUROCHECK LOADED', 'background: purple; color: white; font-size: 16px; padding: 10px;');
        console.log('✅ If you see this message, the NEW version with Neuro-Check is loaded!');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .mode-badge.coach {
            background: #d1fae5;
            color: #065f46;
        }

        .mode-badge.crisis {
            background: #fee2e2;
            color: #991b1b;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.coach {
            background: #22c55e;
            color: white;
        }

        .mode-btn.coach:hover {
            background: #16a34a;
        }

        .mode-btn.coach.active {
            border-color: #065f46;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            transform: scale(1.02);
        }

        .mode-btn.crisis {
            background: #ef4444;
            color: white;
        }

        .mode-btn.crisis:hover {
            background: #dc2626;
        }

        .mode-btn.crisis.active {
            border-color: #991b1b;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
            transform: scale(1.02);
        }

        .content {
            padding: 30px;
        }

        .setup-screen {
            text-align: center;
            padding: 20px;
        }

        .setup-screen h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .setup-screen p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .info-box {
            background: #f0f9ff;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #1e40af;
            font-size: 14px;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .chat-container {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user {
            background: #e0e7ff;
            color: #1e1b4b;
            margin-left: 20px;
        }

        .message.assistant {
            background: white;
            color: #333;
            margin-right: 20px;
            border: 1px solid #e5e7eb;
        }

        .message.system {
            background: #fef3c7;
            color: #78350f;
            text-align: center;
            font-style: italic;
            margin: 10px 40px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .tasks-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .tasks-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .task-category {
            margin-bottom: 20px;
        }

        .task-category h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #f9fafb;
            border-left: 4px solid;
            border-radius: 4px;
            font-size: 14px;
        }

        .task-item.now {
            border-left-color: #22c55e;
        }

        .task-item.soon {
            border-left-color: #fbbf24;
        }

        .task-item.later {
            border-left-color: #94a3b8;
        }

        .empty-state {
            color: #9ca3af;
            font-style: italic;
            padding: 10px 12px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .header, .content {
                padding: 20px;
            }

            .chat-container {
                height: 300px;
            }

            .message.user {
                margin-left: 10px;
            }

            .message.assistant {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // REUSABLE UI COMPONENTS
        // ============================================

        // Card Component
        const Card = ({ children, className = '', ...props }) => (
            <div className={`bg-white rounded-lg shadow-sm border border-gray-200 ${className}`} {...props}>
                {children}
            </div>
        );

        const CardHeader = ({ children, className = '' }) => (
            <div className={`px-6 py-4 border-b border-gray-200 ${className}`}>
                {children}
            </div>
        );

        const CardContent = ({ children, className = '' }) => (
            <div className={`px-6 py-4 ${className}`}>
                {children}
            </div>
        );

        // Badge Component
        const Badge = ({ children, variant = 'default', className = '' }) => {
            const variants = {
                default: 'bg-gray-100 text-gray-700',
                primary: 'bg-blue-100 text-blue-700',
                success: 'bg-green-100 text-green-700',
                warning: 'bg-yellow-100 text-yellow-700',
                danger: 'bg-red-100 text-red-700',
                purple: 'bg-purple-100 text-purple-700'
            };

            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]} ${className}`}>
                    {children}
                </span>
            );
        };

        // Button Component
        const Button = ({ children, variant = 'default', size = 'md', className = '', ...props }) => {
            const variants = {
                default: 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50',
                primary: 'bg-blue-500 text-white hover:bg-blue-600',
                success: 'bg-green-500 text-white hover:bg-green-600',
                danger: 'bg-red-500 text-white hover:bg-red-600',
                ghost: 'bg-transparent hover:bg-gray-100'
            };

            const sizes = {
                sm: 'px-3 py-1.5 text-sm',
                md: 'px-4 py-2 text-base',
                lg: 'px-6 py-3 text-lg'
            };

            return (
                <button
                    className={`rounded-lg font-medium transition-colors ${variants[variant]} ${sizes[size]} ${className}`}
                    {...props}
                >
                    {children}
                </button>
            );
        };

        // Modal Component
        const Modal = ({ isOpen, onClose, children, title }) => {
            if (!isOpen) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ background: 'rgba(0, 0, 0, 0.5)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                        onClick={(e) => e.stopPropagation()}
                    >
                        {title && (
                            <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                                <h2 className="text-xl font-semibold text-gray-900">{title}</h2>
                                <button
                                    onClick={onClose}
                                    className="text-gray-400 hover:text-gray-600 text-2xl leading-none"
                                >
                                    ×
                                </button>
                            </div>
                        )}
                        <div className="px-6 py-4">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================
        // NEURO-CHECK MODAL COMPONENT
        // ============================================

        const NeuroCheckModal = ({ isOpen, onClose, onComplete }) => {
            const [moodLevel, setMoodLevel] = useState(5);
            const [energyUnits, setEnergyUnits] = useState(5);
            const [brainMode, setBrainMode] = useState('Normal');
            const [selectedBurnout, setSelectedBurnout] = useState([]);
            const [calculatedSpoons, setCalculatedSpoons] = useState(null);
            const [showResult, setShowResult] = useState(false);

            if (!isOpen) return null;

            const handleCalculate = () => {
                const result = calculateDailyCapacity(energyUnits, brainMode, selectedBurnout);
                setCalculatedSpoons(result.final_capacity);

                const capacityData = {
                    date: new Date().toISOString().split('T')[0],
                    moodLevel,
                    energyUnits,
                    brainMode,
                    burnoutFlags: selectedBurnout,
                    totalSpoons: result.final_capacity,
                    remainingSpoons: result.final_capacity,
                    quickBoostersUsed: [],
                    adjustments: result,
                    completedAt: new Date().toISOString()
                };

                localStorage.setItem(
                    `calm-neuro-check-${capacityData.date}`,
                    JSON.stringify(capacityData)
                );

                setShowResult(true);
                onComplete(capacityData);
            };

            const toggleBurnout = (indicatorId) => {
                setSelectedBurnout(prev =>
                    prev.includes(indicatorId)
                        ? prev.filter(id => id !== indicatorId)
                        : [...prev, indicatorId]
                );
            };

            const getMoodEmoji = (level) => {
                if (level <= 3) return '😢';
                if (level <= 6) return '😐';
                if (level <= 8) return '🙂';
                return '😊';
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ background: 'rgba(0, 0, 0, 0.5)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                            <h2 className="text-xl font-semibold text-gray-900">Daily Neuro-Check</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl leading-none"
                            >
                                ×
                            </button>
                        </div>

                        <div className="px-6 py-4">
                            {!showResult ? (
                                <>
                                    <p className="text-gray-600 mb-6">
                                        Let's figure out your spoon capacity for today. This helps us plan realistically.
                                    </p>

                                    {/* Mood Level Slider */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Mood Level (for tracking patterns)
                                        </label>
                                        <div className="flex items-center gap-4">
                                            <span className="text-4xl">{getMoodEmoji(moodLevel)}</span>
                                            <div className="flex-1">
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="10"
                                                    value={moodLevel}
                                                    onChange={(e) => setMoodLevel(parseInt(e.target.value))}
                                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600"
                                                />
                                                <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                    <span>1 (low)</span>
                                                    <span className="font-semibold text-purple-600">{moodLevel}/10</span>
                                                    <span>10 (high)</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Energy Units Slider */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Energy Units (Spoons You Woke Up With)
                                        </label>
                                        <div className="flex items-center gap-4">
                                            <span className="text-4xl">{'🥄'.repeat(Math.max(1, energyUnits))}</span>
                                            <div className="flex-1">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="10"
                                                    value={energyUnits}
                                                    onChange={(e) => setEnergyUnits(parseInt(e.target.value))}
                                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                                />
                                                <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                    <span>0 (depleted)</span>
                                                    <span className="font-semibold text-blue-600">{energyUnits} spoons</span>
                                                    <span>10 (full)</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Brain Mode Selector */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Brain Mode
                                        </label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['Normal', 'Fog', 'Shutdown'].map(mode => (
                                                <button
                                                    key={mode}
                                                    onClick={() => setBrainMode(mode)}
                                                    className={`px-4 py-3 rounded-lg font-medium transition-all ${
                                                        brainMode === mode
                                                            ? 'bg-purple-600 text-white shadow-lg'
                                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    {mode}
                                                    {mode === 'Fog' && ' (-2)'}
                                                    {mode === 'Shutdown' && ' (-4)'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Burnout Indicators */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Burnout Indicators
                                            {selectedBurnout.length >= 3 && (
                                                <span className="ml-2 text-red-600 font-semibold">
                                                    (Protection mode: -3 spoons)
                                                </span>
                                            )}
                                        </label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {BURNOUT_INDICATORS.map(indicator => (
                                                <button
                                                    key={indicator.id}
                                                    onClick={() => toggleBurnout(indicator.id)}
                                                    className={`p-3 text-left rounded-lg transition-all ${
                                                        selectedBurnout.includes(indicator.id)
                                                            ? 'bg-red-100 border-2 border-red-400 shadow-sm'
                                                            : 'bg-gray-50 border-2 border-transparent hover:bg-gray-100'
                                                    }`}
                                                >
                                                    <div className="flex items-start gap-2">
                                                        <span className="text-xl">{indicator.icon}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="text-sm font-medium text-gray-900">
                                                                {indicator.label}
                                                            </div>
                                                            <div className="text-xs text-gray-500 mt-0.5">
                                                                {indicator.description}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                        {selectedBurnout.length >= 3 && (
                                            <div className="mt-3 p-3 bg-red-50 border-l-4 border-red-400 text-sm text-red-700">
                                                ⚠️ Multiple burnout indicators detected. Applying protection mode to prevent overcommitment.
                                            </div>
                                        )}
                                    </div>

                                    {/* Calculate Button */}
                                    <button
                                        onClick={handleCalculate}
                                        className="w-full bg-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors"
                                    >
                                        Calculate My Spoons
                                    </button>
                                </>
                            ) : (
                                /* Result Display */
                                <div className="text-center py-6">
                                    <div className="text-6xl mb-4">
                                        {'🥄 '.repeat(calculatedSpoons || 1)}
                                    </div>
                                    <h3 className="text-3xl font-bold text-gray-900 mb-2">
                                        {calculatedSpoons} spoons today
                                    </h3>
                                    <p className="text-gray-600 mb-6">
                                        Your daily capacity has been calculated and saved.
                                    </p>

                                    {/* Breakdown */}
                                    <div className="bg-gray-50 rounded-lg p-4 mb-6 text-left">
                                        <div className="text-sm font-medium text-gray-700 mb-2">Calculation:</div>
                                        <div className="space-y-1 text-sm text-gray-600">
                                            <div>Starting energy: {energyUnits} spoons</div>
                                            {brainMode !== 'Normal' && (
                                                <div>Brain mode ({brainMode}): {brainMode === 'Fog' ? '-2' : '-4'} spoons</div>
                                            )}
                                            {selectedBurnout.length >= 3 && (
                                                <div>Burnout protection: -3 spoons</div>
                                            )}
                                            <div className="pt-2 border-t border-gray-300 font-semibold text-gray-900">
                                                Final capacity: {calculatedSpoons} spoons
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => {
                                            onClose();
                                            setShowResult(false);
                                        }}
                                        className="w-full bg-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors"
                                    >
                                        Start My Day
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================
        // END REUSABLE COMPONENTS
        // ============================================

        // Crisis keywords for auto-detection
        const CRISIS_KEYWORDS = [
            "overwhelmed", "frozen", "shutdown", "too much", "crisis",
            "can't do this", "help", "drowning", "stuck"
        ];

        // ============================================
        // ENERGY MANAGEMENT CONSTANTS
        // ============================================

        // Burnout indicators (7 total)
        const BURNOUT_INDICATORS = [
            {
                id: 'sleep_disrupted',
                label: 'Sleep Disrupted',
                description: 'Irregular or insufficient rest patterns',
                icon: '😴'
            },
            {
                id: 'emotional_exhaustion',
                label: 'Emotional Exhaustion',
                description: 'Drained emotional reserves',
                icon: '😓'
            },
            {
                id: 'cognitive_overload',
                label: 'Cognitive Overload',
                description: 'Mental processing at maximum',
                icon: '🧠'
            },
            {
                id: 'social_withdrawal',
                label: 'Social Withdrawal',
                description: 'Reduced interaction capacity',
                icon: '🚪'
            },
            {
                id: 'physical_fatigue',
                label: 'Physical Fatigue',
                description: 'Body-level tiredness',
                icon: '🥱'
            },
            {
                id: 'motivation_loss',
                label: 'Motivation Loss',
                description: 'Reduced drive for activities',
                icon: '😑'
            },
            {
                id: 'increased_irritability',
                label: 'Increased Irritability',
                description: 'Heightened frustration responses',
                icon: '😤'
            }
        ];

        // Quick spoon boosters
        const QUICK_BOOSTERS = [
            {
                id: 'coffee',
                name: 'Coffee/Caffeine',
                spoons: 1,
                duration: 'instant',
                type: 'Chemical stimulant',
                icon: '☕'
            },
            {
                id: 'walk',
                name: '5-min walk',
                spoons: 1,
                duration: '5m',
                type: 'Movement activation',
                icon: '🚶'
            },
            {
                id: 'medication',
                name: 'ADHD medication',
                spoons: 2,
                duration: 'instant',
                type: 'Medical intervention',
                icon: '💊'
            },
            {
                id: 'nap',
                name: '20-min power nap',
                spoons: 2,
                duration: '20m',
                type: 'Rest recovery',
                icon: '😴'
            },
            {
                id: 'breathing',
                name: 'Deep breathing',
                spoons: 1,
                duration: '2m',
                type: 'Calm activation',
                icon: '🫁'
            },
            {
                id: 'weighted_blanket',
                name: 'Weighted Blanket',
                spoons: 1,
                duration: 'instant',
                type: 'Sensory comfort',
                icon: '🛏️'
            },
            {
                id: 'protein_snack',
                name: 'Protein Snack',
                spoons: 1,
                duration: 'instant',
                type: 'Physical nourishment',
                icon: '🥜'
            },
            {
                id: 'body_double',
                name: 'Body Double Session',
                spoons: 2,
                duration: 'varies',
                type: 'Social support',
                icon: '👥'
            },
            {
                id: 'music',
                name: 'Music',
                spoons: 1,
                duration: 'instant',
                type: 'Mood activation',
                icon: '🎵'
            },
            {
                id: 'stretching',
                name: 'Stretching',
                spoons: 1,
                duration: '5m',
                type: 'Movement activation',
                icon: '🤸'
            }
        ];

        // Spoon calculation function
        const calculateDailyCapacity = (energyUnits, brainMode, burnoutFlags) => {
            let capacity = energyUnits; // 0-10 base

            // Brain mode adjustment
            const brainModeAdjustments = {
                'Normal': 0,
                'Fog': -2,
                'Shutdown': -4
            };
            const brainModeAdj = brainModeAdjustments[brainMode] || 0;
            capacity += brainModeAdj;

            // Burnout protection (3+ flags = -3 spoons)
            const burnoutAdj = burnoutFlags.length >= 3 ? -3 : 0;
            capacity += burnoutAdj;

            // Floor at 0
            const finalCapacity = Math.max(0, capacity);

            return {
                original_energy: energyUnits,
                brain_mode_adjustment: brainModeAdj,
                burnout_adjustment: burnoutAdj,
                final_capacity: finalCapacity
            };
        };

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [isSetup, setIsSetup] = useState(false);
            const [messages, setMessages] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [completedTasks, setCompletedTasks] = useState([]);
            const [currentMode, setCurrentMode] = useState('coach');
            const [currentView, setCurrentView] = useState('today');
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [dailyEnergy, setDailyEnergy] = useState(null);
            const [calendarInput, setCalendarInput] = useState('');
            const [showCompleteModal, setShowCompleteModal] = useState(false);
            const [taskToComplete, setTaskToComplete] = useState(null);
            const [showBulkUploadModal, setShowBulkUploadModal] = useState(false);
            const [bulkUploadText, setBulkUploadText] = useState('');
            const [bulkUploadClient, setBulkUploadClient] = useState('');
            const [bulkUploadBillable, setBulkUploadBillable] = useState(false);
            const [showBreakdownModal, setShowBreakdownModal] = useState(false);
            const [taskToBreakdown, setTaskToBreakdown] = useState(null);
            const [breakdownSubtasks, setBreakdownSubtasks] = useState([]);
            const [isBreakingDown, setIsBreakingDown] = useState(false);
            const [showBillingView, setShowBillingView] = useState(false);
            const [expandedParents, setExpandedParents] = useState({});
            const [showEstimateModal, setShowEstimateModal] = useState(false);
            const [pendingTask, setPendingTask] = useState(null);
            const [showAddTask, setShowAddTask] = useState(false);
            const [billingMonth, setBillingMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });

            // Neuro-check state
            const [showNeuroCheck, setShowNeuroCheck] = useState(false);
            const [dailyCapacity, setDailyCapacity] = useState(() => {
                const today = new Date().toISOString().split('T')[0];
                const stored = localStorage.getItem(`calm-neuro-check-${today}`);
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        return {
                            date: today,
                            moodLevel: null,
                            energyUnits: null,
                            brainMode: null,
                            burnoutFlags: [],
                            totalSpoons: 0,
                            remainingSpoons: 0,
                            quickBoostersUsed: [],
                            adjustments: {},
                            completedAt: null
                        };
                    }
                }
                return {
                    date: today,
                    moodLevel: null,
                    energyUnits: null,
                    brainMode: null,
                    burnoutFlags: [],
                    totalSpoons: 0,
                    remainingSpoons: 0,
                    quickBoostersUsed: [],
                    adjustments: {},
                    completedAt: null
                };
            });

            const chatEndRef = useRef(null);

            // Load from localStorage on mount
            useEffect(() => {
                const savedKey = localStorage.getItem('calmCommanderApiKey');
                const savedMessages = localStorage.getItem('calmCommanderMessages');
                const savedTasks = localStorage.getItem('calmCommanderTasks');
                const savedMode = localStorage.getItem('calmCommanderMode');
                const savedEnergy = localStorage.getItem('ccDailyEnergy');
                const savedCompleted = localStorage.getItem('ccCompletedTasks');
                const savedCalendar = localStorage.getItem('ccCalendarInput');

                if (savedKey) {
                    setApiKey(savedKey);
                    setIsSetup(true);
                }
                if (savedMessages) {
                    setMessages(JSON.parse(savedMessages));
                }
                if (savedTasks) {
                    try {
                        const parsed = JSON.parse(savedTasks);
                        // Ensure it's an array
                        if (Array.isArray(parsed)) {
                            setTasks(parsed);
                        } else {
                            setTasks([]);
                            localStorage.removeItem('calmCommanderTasks');
                        }
                    } catch (e) {
                        setTasks([]);
                        localStorage.removeItem('calmCommanderTasks');
                    }
                }
                if (savedMode) {
                    setCurrentMode(savedMode);
                }
                if (savedEnergy) {
                    const energy = JSON.parse(savedEnergy);
                    // Check if it's today's energy
                    if (energy.date === new Date().toDateString()) {
                        setDailyEnergy(energy);
                    }
                }
                if (savedCompleted) {
                    try {
                        const parsed = JSON.parse(savedCompleted);
                        if (Array.isArray(parsed)) {
                            setCompletedTasks(parsed);

                        setCompletedTasks([]);

                }
                if (savedCalendar) {

                    // Check if it's today's calendar
                    if (calendar.date === new Date().toDateString()) {
                        setCalendarInput(calendar.input);

                }

                // Add welcome message if first time
                if (!savedMessages && savedKey) {
                    const welcomeMsg = {

                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            }, []);

            // Auto-scroll chat only when new messages are added
            const prevMessageCount = useRef(0);
            useEffect(() => {
                // Only scroll if message count actually increased
                if (messages.length > prevMessageCount.current) {
                    chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                    prevMessageCount.current = messages.length;
                } else {
                    prevMessageCount.current = messages.length;
                }
            }, [messages]);

            // Save calendar input to localStorage when it changes
            useEffect(() => {
                if (calendarInput !== '') {
                    const calendar = {
                        date: new Date().toDateString(),
                        input: calendarInput
                    };
                    localStorage.setItem('ccCalendarInput', JSON.stringify(calendar));
                }
            }, [calendarInput]);

            const handleSetup = () => {
                if (apiKey.trim()) {
                    localStorage.setItem('calmCommanderApiKey', apiKey);
                    setIsSetup(true);

                    const welcomeMsg = {
                        role: 'assistant',
                        content: "Hi there. I'm here to help you feel calmer and more clear. Let's take this one step at a time. What's on your mind right now?"
                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            };

            // ============================================
            // AI ESTIMATION FUNCTIONS
            // ============================================

            // Estimate spoons required based on task title keywords
            const estimateSpoons = (title) => {
                const lowerTitle = title.toLowerCase();

                // 1 spoon - Simple, quick tasks
                const simpleKeywords = ['quick', 'simple', 'email', 'text', 'call', 'check', 'review', 'read', 'respond', 'reply', 'short'];
                if (simpleKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 1;
                }

                // 3 spoons - Complex tasks
                const complexKeywords = ['write', 'create', 'prepare', 'design', 'analyze', 'research', 'plan', 'organize', 'develop'];
                if (complexKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 3;
                }

                // 4 spoons - High-demand tasks
                const demandingKeywords = ['presentation', 'proposal', 'strategy', 'difficult', 'complex', 'major', 'important', 'critical'];
                if (demandingKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 4;
                }

                // 2 spoons - Default (routine tasks)
                return 2;
            };

            // Estimate time required based on task title keywords (returns minutes)
            const estimateTimeMinutes = (title) => {
                const lowerTitle = title.toLowerCase();

                // 15 minutes - Quick tasks
                const quickKeywords = ['quick', 'email', 'text', 'check', 'short', '5-min', '10-min'];
                if (quickKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 15;
                }

                // 30 minutes
                const halfHourKeywords = ['brief', 'quick call', 'standup', 'update', 'review'];
                if (halfHourKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 30;
                }

                // 2 hours
                const twoHourKeywords = ['write', 'prepare', 'create', 'design', 'develop'];
                if (twoHourKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 120;
                }

                // 3 hours - Major tasks
                const majorKeywords = ['proposal', 'presentation', 'strategy', 'report', 'analysis'];
                if (majorKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 180;
                }

                // Look for explicit time mentions
                const timeMatch = lowerTitle.match(/(\d+)\s*(min|hour|hr)/i);
                if (timeMatch) {
                    const value = parseInt(timeMatch[1]);
                    const unit = timeMatch[2].toLowerCase();
                    if (unit.startsWith('min')) {
                        return value;
                    } else {
                        return value * 60; // Convert hours to minutes
                    }
                }

                // 1 hour - Default
                return 60;
            };

            // Convert energy level to spoons (for backward compatibility)
            const energyToSpoons = (energyRequired) => {
                const mapping = {
                    'low': 1,
                    'medium': 2,
                    'high': 3
                };
                return mapping[energyRequired] || 2;
            };

            // Task management functions
            const addTask = (title, category = 'Uncategorized', energyRequired = 'medium', view = 'later', client = '', billable = false, estimatedTime = null, priority = 'medium') => {
                // AI estimate spoons and time if not provided
                const spoonsRequired = estimateSpoons(title);
                const estimatedMinutes = estimatedTime !== null ? estimatedTime : estimateTimeMinutes(title);

                const newTask = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    energyRequired: energyRequired,
                    spoonsRequired: spoonsRequired,  // NEW: AI-estimated spoons
                    estimatedTime: estimatedMinutes,  // Time in minutes
                    priority: priority,  // NEW: low/medium/high
                    view: view,
                    client: client,
                    billable: billable,
                    status: 'active',
                    createdDate: Date.now(),
                    subtasks: []  // NEW: support subtasks
                };
                // Ensure tasks is always an array
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = [...currentTasks, newTask];
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const deleteTask = (taskId) => {
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const moveTask = (taskId, newView) => {
                const updatedTasks = tasks.map(t =>
                    t.id === taskId ? { ...t, view: newView } : t
                );
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const completeTask = (taskId, actualTime) => {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                // Deduct spoons from daily capacity
                if (dailyCapacity && dailyCapacity.totalSpoons > 0 && task.spoonsRequired) {
                    const updatedCapacity = {
                        ...dailyCapacity,
                        remainingSpoons: Math.max(0, dailyCapacity.remainingSpoons - task.spoonsRequired)
                    };
                    setDailyCapacity(updatedCapacity);
                    localStorage.setItem(`calm-neuro-check-${updatedCapacity.date}`, JSON.stringify(updatedCapacity));
                }

                // Create completed task with time data
                const completedTask = {
                    ...task,
                    status: 'completed',
                    completedDate: Date.now(),
                    actualTime: actualTime
                };

                // Remove from active tasks
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Add to completed tasks
                const updatedCompleted = [...completedTasks, completedTask];
                setCompletedTasks(updatedCompleted);
                localStorage.setItem('ccCompletedTasks', JSON.stringify(updatedCompleted));

                // Close modal
                setShowCompleteModal(false);
                setTaskToComplete(null);
            };

            // ============================================
            // INLINE TASK EDITING FUNCTIONS
            // ============================================

            const updateTaskAttribute = (taskId, attribute, value) => {
                const updatedTasks = tasks.map(t =>
                    t.id === taskId ? { ...t, [attribute]: value } : t
                );
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const formatTimeDisplay = (minutes) => {
                if (minutes < 60) {
                    return `${minutes}m`;
                } else {
                    const hours = Math.floor(minutes / 60);
                    const mins = minutes % 60;
                    if (mins === 0) {
                        return `${hours}h`;
                    } else {
                        return `${hours}h ${mins}m`;
                    }
                }
            };

            const setEnergy = (level) => {
                const energy = {
                    date: new Date().toDateString(),
                    level: level,
                    timestamp: Date.now()
                };
                setDailyEnergy(energy);
                localStorage.setItem('ccDailyEnergy', JSON.stringify(energy));
            };

            const handleBulkUpload = () => {
                if (!bulkUploadText.trim()) return;

                // Parse text into individual tasks
                const lines = bulkUploadText.split('\n');
                const newTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    // Skip empty lines and very short entries
                    if (trimmed && trimmed.length > 2) {
                        // Remove common prefixes like bullets, numbers, checkboxes
                        let taskText = trimmed
                            .replace(/^[-•*]\s*/, '')  // Remove bullet points
                            .replace(/^\d+[\.)]\s*/, '')  // Remove numbered lists
                            .replace(/^[\[\(]?\s*[xX\s]?\s*[\]\)]?\s*/, '')  // Remove checkboxes
                            .trim();

                        if (taskText && taskText.length > 2) {
                            newTasks.push({
                                id: Date.now() + Math.random(),
                                title: taskText,
                                category: 'Bulk Upload',
                                energyRequired: 'medium',
                                spoonsRequired: estimateSpoons(taskText),  // AI estimation
                                estimatedTime: estimateTimeMinutes(taskText),  // AI estimation
                                priority: 'medium',
                                view: 'later',  // Brain dump location
                                client: bulkUploadClient.trim(),
                                billable: bulkUploadBillable,
                                status: 'active',
                                createdDate: Date.now(),
                                subtasks: []
                            });
                        }
                    }
                });

                if (newTasks.length > 0) {
                    const currentTasks = Array.isArray(tasks) ? tasks : [];
                    const updatedTasks = [...currentTasks, ...newTasks];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                    // Close modal and reset
                    setShowBulkUploadModal(false);
                    setBulkUploadText('');
                    setBulkUploadClient('');
                    setBulkUploadBillable(false);
                }
            };

            const handleBreakdownTask = async (task) => {
                setTaskToBreakdown(task);
                setShowBreakdownModal(true);
                setIsBreakingDown(true);
                setBreakdownSubtasks([]);

                try {
                    const breakdownPrompt = `I have a task that feels overwhelming: "${task.title}"

Please break this down into 3-5 smaller, concrete steps that I can do one at a time. Make each step:
- Specific and actionable
- Small enough to complete in one sitting
- Clear about what "done" looks like

Format your response as a simple numbered list, one step per line.`;

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: breakdownPrompt,
                            mode: 'coach',
                            apiKey: apiKey
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Parse the AI response to extract subtasks
                        const lines = data.response.split('\n');
                        const subtasks = [];

                        lines.forEach(line => {
                            const trimmed = line.trim();
                            // Match numbered lists like "1. ", "1) ", or bullet points
                            const match = trimmed.match(/^(?:\d+[\.)]\s*|[-•*]\s*)(.+)$/);
                            if (match && match[1] && match[1].length > 3) {
                                subtasks.push(match[1].trim());
                            }
                        });

                        setBreakdownSubtasks(subtasks);
                    } else {
                        setBreakdownSubtasks(['Error: Could not get breakdown from AI']);
                    }
                } catch (error) {
                    setBreakdownSubtasks(['Error: Failed to connect to AI']);
                }

                setIsBreakingDown(false);
            };

            const addSubtasksToList = () => {
                if (breakdownSubtasks.length === 0 || !taskToBreakdown) return;

                // Mark parent task as having subtasks
                const updatedParent = {
                    ...taskToBreakdown,
                    hasSubtasks: true,
                    subtaskCount: breakdownSubtasks.length
                };

                // Add each subtask with link to parent
                // If parent has estimate, divide it among subtasks
                const subtaskEstimate = taskToBreakdown.estimatedTime
                    ? taskToBreakdown.estimatedTime / breakdownSubtasks.length
                    : null;

                const newSubtasks = breakdownSubtasks.map((subtaskTitle, index) => ({
                    id: Date.now() + Math.random() + index,
                    title: subtaskTitle,
                    category: taskToBreakdown.category || 'Uncategorized',
                    energyRequired: taskToBreakdown.energyRequired || 'medium',
                    view: taskToBreakdown.view || 'later',
                    client: taskToBreakdown.client || '',
                    billable: taskToBreakdown.billable || false,
                    estimatedTime: subtaskEstimate,
                    parentTaskId: taskToBreakdown.id,
                    status: 'active',
                    createdDate: Date.now()
                }));

                // Update tasks: replace parent with updated parent, add all subtasks
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = currentTasks.map(t =>
                    t.id === taskToBreakdown.id ? updatedParent : t
                ).concat(newSubtasks);

                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Expand parent by default
                setExpandedParents({...expandedParents, [taskToBreakdown.id]: true});

                // Close modal
                setShowBreakdownModal(false);
                setTaskToBreakdown(null);
                setBreakdownSubtasks([]);
            };

            const detectCrisisMode = (text) => {
                const lowerText = text.toLowerCase();
                return CRISIS_KEYWORDS.some(keyword => lowerText.includes(keyword));
            };

            const parseCalendarInput = (input) => {
                if (!input || !input.trim()) return 0;

                let totalBusyHours = 0;
                const text = input.toLowerCase();

                // Match explicit hours like "3 hours", "3 hrs", "3h"
                const explicitHoursMatch = text.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\s+(?:in|of|for)?\s*(?:meetings?|calls?)?/gi);
                if (explicitHoursMatch) {
                    explicitHoursMatch.forEach(match => {
                        const hours = parseFloat(match.match(/(\d+(?:\.\d+)?)/)[1]);
                        totalBusyHours += hours;
                    });
                }

                // Match time ranges like "2-3pm", "9:30-11am", "2pm-4pm"
                const timeRangeRegex = /(\d{1,2})(?::(\d{2}))?\s*(?:am|pm)?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi;
                const timeRanges = text.matchAll(timeRangeRegex);

                for (const match of timeRanges) {
                    let startHour = parseInt(match[1]);
                    const startMin = match[2] ? parseInt(match[2]) : 0;
                    let endHour = parseInt(match[3]);
                    const endMin = match[4] ? parseInt(match[4]) : 0;
                    const period = match[5];

                    // Convert to 24-hour format
                    if (period === 'pm' && endHour !== 12) endHour += 12;
                    if (period === 'am' && endHour === 12) endHour = 0;
                    if (period === 'pm' && startHour < 12 && startHour < endHour - 12) startHour += 12;
                    if (period === 'am' && startHour === 12) startHour = 0;

                    const durationHours = (endHour + endMin / 60) - (startHour + startMin / 60);
                    if (durationHours > 0 && durationHours < 12) {
                        totalBusyHours += durationHours;
                    }
                }

                // Match individual hour mentions like "2pm", "3:30pm" (count as 1 hour each)
                if (totalBusyHours === 0) {
                    const singleTimes = text.match(/(?:^|[,;])\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)/gi);
                    if (singleTimes) {
                        totalBusyHours = singleTimes.length * 1; // Assume 1 hour per meeting mentioned
                    }
                }

                return Math.min(totalBusyHours, 16); // Cap at 16 hours to avoid nonsense
            };

            const parseTasks = (responseText) => {
                // Simple task parsing for Step 1
                // Just extract tasks that AI mentions with emoji markers
                const lines = responseText.split('\n');
                const foundTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    // Look for task markers
                    if (trimmed.startsWith('✅') || trimmed.startsWith('⏳') || trimmed.startsWith('📅')) {
                        const taskText = trimmed.replace(/^[✅⏳📅💬]\s*/, '').replace(/now:|soon:|later:|do now:|delay:|ask for help:/i, '').trim();
                        if (taskText && taskText.length > 3) {
                            foundTasks.push(taskText);
                        }
                    }
                });

                // Add found tasks to master list
                if (foundTasks.length > 0) {
                    const newTaskObjects = foundTasks.map(taskText => ({
                        id: Date.now() + Math.random(),
                        title: taskText,
                        category: 'From AI',
                        status: 'active',
                        createdDate: Date.now()
                    }));
                    const updatedTasks = [...tasks, ...newTaskObjects];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
                }
            };

            const switchMode = (newMode, isAuto = false) => {
                if (newMode !== currentMode) {
                    setCurrentMode(newMode);
                    localStorage.setItem('calmCommanderMode', newMode);

                    const modeMsg = {
                        role: 'system',
                        content: isAuto
                            ? `Switching to ${newMode} mode. I'm here...`
                            : `Switched to ${newMode} mode.`
                    };
                    const updatedMessages = [...messages, modeMsg];
                    setMessages(updatedMessages);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));
                }
            };

            const sendMessage = async () => {
                if (!inputMessage.trim() || isLoading) return;

                const userMsg = { role: 'user', content: inputMessage };
                const updatedMessages = [...messages, userMsg];
                setMessages(updatedMessages);
                localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));

                // Check for manual mode switch requests
                const lowerInput = inputMessage.toLowerCase();
                if (lowerInput.includes('back to normal mode') || lowerInput.includes('coach mode')) {
                    switchMode('coach');
                } else if (detectCrisisMode(inputMessage)) {
                    switchMode('crisis', true);
                }

                setInputMessage('');
                setIsLoading(true);

                // Build context about current tasks and state
                let context = '';

                // Add energy level if set today
                if (dailyEnergy && dailyEnergy.level) {
                    context += `\n\nCurrent energy level: ${dailyEnergy.level}\n`;
                }

                // Add calendar info if entered
                if (calendarInput && calendarInput.trim()) {
                    const busyHours = parseCalendarInput(calendarInput);
                    context += `\nCalendar today: ${calendarInput} (${busyHours.toFixed(1)}h in meetings/calls)\n`;
                }

                // Add active tasks grouped by view
                const activeTasks = tasks.filter(t => !completedTasks.some(ct => ct.id === t.id));

                if (activeTasks.length > 0) {
                    context += `\n--- CURRENT TASK LIST (${activeTasks.length} tasks) ---\n`;

                    const todayTasks = activeTasks.filter(t => t.view === 'today');
                    const thisWeekTasks = activeTasks.filter(t => t.view === 'thisweek');
                    const laterTasks = activeTasks.filter(t => t.view === 'later');

                    if (todayTasks.length > 0) {
                        context += `\nToday (${todayTasks.length}):\n`;
                        todayTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (thisWeekTasks.length > 0) {
                        context += `\nThis Week (${thisWeekTasks.length}):\n`;
                        thisWeekTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (laterTasks.length > 0) {
                        context += `\nLater (${laterTasks.length}):\n`;
                        laterTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            context += taskLine + '\n';
                        });
                    }
                    context += '--- END TASK LIST ---\n';

                                    onClick={() => {

                                                                            <div key={task.id} style={{
                                                                                marginBottom: '8px',
                                                                                paddingBottom: '8px',
                                                                                borderBottom: '1px solid #f3f4f6',
                                                                                fontSize: '14px'
                                                                            }}>
                                                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start'}}>
                                                                                    <div style={{flex: 1}}>
                                                                                        <span>{task.title}</span>
                                                                                        <div style={{
                                                                                            fontSize: '12px',
                                                                                            color: '#6b7280',
                                                                                            marginTop: '2px'
                                                                                        }}>
                                                                                            {dateStr}
                                                                                        </div>
                                                                                    </div>
                                                                                    <span style={{fontWeight: 600, marginLeft: '12px'}}>
                                                                                        {parseFloat(task.actualTime).toFixed(2)}h
                                                                                    </span>
                                                                                </div>
                                                                                {task.billable && (
                                                                                    <span style={{
                                                                                        fontSize: '11px',
                                                                                        padding: '2px 6px',
                                                                                        borderRadius: '4px',
                                                                                        background: '#d1fae5',
                                                                                        color: '#065f46',
                                                                                        fontWeight: 600
                                                                                    }}>
                                                                                    $ Billable
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })
                                                )}

                                                <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: '20px'}}>
                                                    <button
                                                        onClick={() => setShowBillingView(false)}
                                                        style={{
                                                            padding: '10px 20px',
                                                            background: '#6b7280',
                                                            color: 'white',
                                                            border: 'none',
                                                            borderRadius: '8px',
                                                            cursor: 'pointer',
                                                            fontWeight: 600
                                                        }}
                                                    >
                                                        Close
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {/* Task Breakdown Modal */}
                        {showBreakdownModal && taskToBreakdown && (
                            <div style={{
                                position: 'fixed',
                                top: 0,
                                left: 0,
                                right: 0,
                                bottom: 0,
                                background: 'rgba(0, 0, 0, 0.5)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                zIndex: 1000
                            }} onClick={() => !isBreakingDown && setShowBreakdownModal(false)}>
                                <div style={{
                                    background: 'white',
                                    borderRadius: '16px',
                                    padding: '30px',
                                    maxWidth: '600px',
                                    width: '90%',
                                    maxHeight: '80vh',
                                    overflowY: 'auto'
                                }} onClick={(e) => e.stopPropagation()}>
                                    <h3 style={{marginBottom: '15px', color: '#333'}}>Break Down Task</h3>
                                    <p style={{marginBottom: '15px', padding: '12px', background: '#f9fafb', borderRadius: '8px', fontSize: '15px'}}>
                                        <strong>{taskToBreakdown.title}</strong>
                                    </p>

                                    {isBreakingDown ? (
                                        <div style={{textAlign: 'center', padding: '40px 20px'}}>
                                            <p style={{fontSize: '16px', color: '#6b7280', marginBottom: '10px'}}>
                                                Breaking this down into smaller steps...
                                            </p>
                                            <p style={{fontSize: '14px', color: '#9ca3af'}}>
                                                The AI is thinking...
                                            </p>
                                        </div>
                                    ) : breakdownSubtasks.length > 0 ? (
                                        <div>
                                            <h4 style={{fontSize: '15px', marginBottom: '12px', color: '#333'}}>
                                                Suggested Steps:
                                            </h4>
                                            <ol style={{marginBottom: '20px', paddingLeft: '24px'}}>
                                                {breakdownSubtasks.map((subtask, index) => (
                                                    <li key={index} style={{
                                                        marginBottom: '8px',
                                                        fontSize: '14px',
                                                        lineHeight: '1.5',
                                                        color: '#374151'
                                                    }}>
                                                        {subtask}
                                                    </li>
                                                ))}
                                            </ol>
                                            <div style={{display: 'flex', gap: '10px', justifyContent: 'flex-end'}}>
                                                <button
                                                    onClick={() => {
                                                        setShowBreakdownModal(false);
                                                        setTaskToBreakdown(null);
                                                        setBreakdownSubtasks([]);
                                                    }}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#6b7280',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Cancel
                                                </button>
                                                <button
                                                    onClick={addSubtasksToList}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#8b5cf6',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Add These Steps as Tasks
                                                </button>
                                            </div>
                                        </div>
                                    ) : null}
                                </div>
                            </div>
                        )}

                        {/* Neuro-Check Modal */}
                        <NeuroCheckModal
                            isOpen={showNeuroCheck}
                            onClose={() => setShowNeuroCheck(false)}
                            onComplete={(capacityData) => {
                                setDailyCapacity(capacityData);
                                setShowNeuroCheck(false);
                            }}
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
