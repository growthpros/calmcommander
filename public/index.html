<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm Commander - AuDHD Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .mode-badge.coach {
            background: #d1fae5;
            color: #065f46;
        }

        .mode-badge.crisis {
            background: #fee2e2;
            color: #991b1b;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.coach {
            background: #22c55e;
            color: white;
        }

        .mode-btn.coach:hover {
            background: #16a34a;
        }

        .mode-btn.coach.active {
            border-color: #065f46;
        }

        .mode-btn.crisis {
            background: #ef4444;
            color: white;
        }

        .mode-btn.crisis:hover {
            background: #dc2626;
        }

        .mode-btn.crisis.active {
            border-color: #991b1b;
        }

        .content {
            padding: 30px;
        }

        .setup-screen {
            text-align: center;
            padding: 20px;
        }

        .setup-screen h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .setup-screen p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .info-box {
            background: #f0f9ff;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #1e40af;
            font-size: 14px;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .chat-container {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user {
            background: #e0e7ff;
            color: #1e1b4b;
            margin-left: 20px;
        }

        .message.assistant {
            background: white;
            color: #333;
            margin-right: 20px;
            border: 1px solid #e5e7eb;
        }

        .message.system {
            background: #fef3c7;
            color: #78350f;
            text-align: center;
            font-style: italic;
            margin: 10px 40px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .tasks-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .tasks-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .task-category {
            margin-bottom: 20px;
        }

        .task-category h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #f9fafb;
            border-left: 4px solid;
            border-radius: 4px;
            font-size: 14px;
        }

        .task-item.now {
            border-left-color: #22c55e;
        }

        .task-item.soon {
            border-left-color: #fbbf24;
        }

        .task-item.later {
            border-left-color: #94a3b8;
        }

        .empty-state {
            color: #9ca3af;
            font-style: italic;
            padding: 10px 12px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .header, .content {
                padding: 20px;
            }

            .chat-container {
                height: 300px;
            }

            .message.user {
                margin-left: 10px;
            }

            .message.assistant {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Crisis keywords for auto-detection
        const CRISIS_KEYWORDS = [
            "overwhelmed", "frozen", "shutdown", "too much", "crisis",
            "can't do this", "help", "drowning", "stuck"
        ];

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [isSetup, setIsSetup] = useState(false);
            const [messages, setMessages] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [completedTasks, setCompletedTasks] = useState([]);
            const [currentMode, setCurrentMode] = useState('coach');
            const [currentView, setCurrentView] = useState('today');
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [dailyEnergy, setDailyEnergy] = useState(null);
            const [calendarInput, setCalendarInput] = useState('');
            const [showCompleteModal, setShowCompleteModal] = useState(false);
            const [taskToComplete, setTaskToComplete] = useState(null);
            const [showBulkUploadModal, setShowBulkUploadModal] = useState(false);
            const [bulkUploadText, setBulkUploadText] = useState('');
            const [bulkUploadClient, setBulkUploadClient] = useState('');
            const [bulkUploadBillable, setBulkUploadBillable] = useState(false);
            const [showBreakdownModal, setShowBreakdownModal] = useState(false);
            const [taskToBreakdown, setTaskToBreakdown] = useState(null);
            const [breakdownSubtasks, setBreakdownSubtasks] = useState([]);
            const [isBreakingDown, setIsBreakingDown] = useState(false);
            const [showBillingView, setShowBillingView] = useState(false);
            const [expandedParents, setExpandedParents] = useState({});
            const [showEstimateModal, setShowEstimateModal] = useState(false);
            const [pendingTask, setPendingTask] = useState(null);
            const [billingMonth, setBillingMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const chatEndRef = useRef(null);

            // Load from localStorage on mount
            useEffect(() => {
                const savedKey = localStorage.getItem('calmCommanderApiKey');
                const savedMessages = localStorage.getItem('calmCommanderMessages');
                const savedTasks = localStorage.getItem('calmCommanderTasks');
                const savedMode = localStorage.getItem('calmCommanderMode');
                const savedEnergy = localStorage.getItem('ccDailyEnergy');
                const savedCompleted = localStorage.getItem('ccCompletedTasks');
                const savedCalendar = localStorage.getItem('ccCalendarInput');

                if (savedKey) {
                    setApiKey(savedKey);
                    setIsSetup(true);
                }
                if (savedMessages) {
                    setMessages(JSON.parse(savedMessages));
                }
                if (savedTasks) {
                    try {
                        const parsed = JSON.parse(savedTasks);
                        // Ensure it's an array
                        if (Array.isArray(parsed)) {
                            setTasks(parsed);
                        } else {
                            setTasks([]);
                            localStorage.removeItem('calmCommanderTasks');
                        }
                    } catch (e) {
                        setTasks([]);
                        localStorage.removeItem('calmCommanderTasks');
                    }
                }
                if (savedMode) {
                    setCurrentMode(savedMode);
                }
                if (savedEnergy) {
                    const energy = JSON.parse(savedEnergy);
                    // Check if it's today's energy
                    if (energy.date === new Date().toDateString()) {
                        setDailyEnergy(energy);
                    }
                }
                if (savedCompleted) {
                    try {
                        const parsed = JSON.parse(savedCompleted);
                        if (Array.isArray(parsed)) {
                            setCompletedTasks(parsed);
                        }
                    } catch (e) {
                        setCompletedTasks([]);
                    }
                }
                if (savedCalendar) {
                    const calendar = JSON.parse(savedCalendar);
                    // Check if it's today's calendar
                    if (calendar.date === new Date().toDateString()) {
                        setCalendarInput(calendar.input);
                    }
                }

                // Add welcome message if first time
                if (!savedMessages && savedKey) {
                    const welcomeMsg = {
                        role: 'assistant',
                        content: "Hi there. I'm here to help you feel calmer and more clear. Let's take this one step at a time. What's on your mind right now?"
                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            }, []);

            // Auto-scroll chat
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Save calendar input to localStorage when it changes
            useEffect(() => {
                if (calendarInput !== '') {
                    const calendar = {
                        date: new Date().toDateString(),
                        input: calendarInput
                    };
                    localStorage.setItem('ccCalendarInput', JSON.stringify(calendar));
                }
            }, [calendarInput]);

            const handleSetup = () => {
                if (apiKey.trim()) {
                    localStorage.setItem('calmCommanderApiKey', apiKey);
                    setIsSetup(true);

                    const welcomeMsg = {
                        role: 'assistant',
                        content: "Hi there. I'm here to help you feel calmer and more clear. Let's take this one step at a time. What's on your mind right now?"
                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            };

            // Task management functions
            const addTask = (title, category = 'Uncategorized', energyRequired = 'medium', view = 'later', client = '', billable = false, estimatedTime = null) => {
                const newTask = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    energyRequired: energyRequired,
                    view: view,
                    client: client,
                    billable: billable,
                    estimatedTime: estimatedTime,
                    status: 'active',
                    createdDate: Date.now()
                };
                // Ensure tasks is always an array
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = [...currentTasks, newTask];
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const deleteTask = (taskId) => {
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const moveTask = (taskId, newView) => {
                const updatedTasks = tasks.map(t =>
                    t.id === taskId ? { ...t, view: newView } : t
                );
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const completeTask = (taskId, actualTime) => {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                // Create completed task with time data
                const completedTask = {
                    ...task,
                    status: 'completed',
                    completedDate: Date.now(),
                    actualTime: actualTime
                };

                // Remove from active tasks
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Add to completed tasks
                const updatedCompleted = [...completedTasks, completedTask];
                setCompletedTasks(updatedCompleted);
                localStorage.setItem('ccCompletedTasks', JSON.stringify(updatedCompleted));

                // Close modal
                setShowCompleteModal(false);
                setTaskToComplete(null);
            };

            const setEnergy = (level) => {
                const energy = {
                    date: new Date().toDateString(),
                    level: level,
                    timestamp: Date.now()
                };
                setDailyEnergy(energy);
                localStorage.setItem('ccDailyEnergy', JSON.stringify(energy));
            };

            const handleBulkUpload = () => {
                if (!bulkUploadText.trim()) return;

                // Parse text into individual tasks
                const lines = bulkUploadText.split('\n');
                const newTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    // Skip empty lines and very short entries
                    if (trimmed && trimmed.length > 2) {
                        // Remove common prefixes like bullets, numbers, checkboxes
                        let taskText = trimmed
                            .replace(/^[-•*]\s*/, '')  // Remove bullet points
                            .replace(/^\d+[\.)]\s*/, '')  // Remove numbered lists
                            .replace(/^[\[\(]?\s*[xX\s]?\s*[\]\)]?\s*/, '')  // Remove checkboxes
                            .trim();

                        if (taskText && taskText.length > 2) {
                            newTasks.push({
                                id: Date.now() + Math.random(),
                                title: taskText,
                                category: 'Bulk Upload',
                                energyRequired: 'medium',
                                view: 'later',  // Brain dump location
                                client: bulkUploadClient.trim(),
                                billable: bulkUploadBillable,
                                status: 'active',
                                createdDate: Date.now()
                            });
                        }
                    }
                });

                if (newTasks.length > 0) {
                    const currentTasks = Array.isArray(tasks) ? tasks : [];
                    const updatedTasks = [...currentTasks, ...newTasks];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                    // Close modal and reset
                    setShowBulkUploadModal(false);
                    setBulkUploadText('');
                    setBulkUploadClient('');
                    setBulkUploadBillable(false);
                }
            };

            const handleBreakdownTask = async (task) => {
                setTaskToBreakdown(task);
                setShowBreakdownModal(true);
                setIsBreakingDown(true);
                setBreakdownSubtasks([]);

                try {
                    const breakdownPrompt = `I have a task that feels overwhelming: "${task.title}"

Please break this down into 3-5 smaller, concrete steps that I can do one at a time. Make each step:
- Specific and actionable
- Small enough to complete in one sitting
- Clear about what "done" looks like

Format your response as a simple numbered list, one step per line.`;

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: breakdownPrompt,
                            mode: 'coach',
                            apiKey: apiKey
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Parse the AI response to extract subtasks
                        const lines = data.response.split('\n');
                        const subtasks = [];

                        lines.forEach(line => {
                            const trimmed = line.trim();
                            // Match numbered lists like "1. ", "1) ", or bullet points
                            const match = trimmed.match(/^(?:\d+[\.)]\s*|[-•*]\s*)(.+)$/);
                            if (match && match[1] && match[1].length > 3) {
                                subtasks.push(match[1].trim());
                            }
                        });

                        setBreakdownSubtasks(subtasks);
                    } else {
                        setBreakdownSubtasks(['Error: Could not get breakdown from AI']);
                    }
                } catch (error) {
                    setBreakdownSubtasks(['Error: Failed to connect to AI']);
                }

                setIsBreakingDown(false);
            };

            const addSubtasksToList = () => {
                if (breakdownSubtasks.length === 0 || !taskToBreakdown) return;

                // Mark parent task as having subtasks
                const updatedParent = {
                    ...taskToBreakdown,
                    hasSubtasks: true,
                    subtaskCount: breakdownSubtasks.length
                };

                // Add each subtask with link to parent
                // If parent has estimate, divide it among subtasks
                const subtaskEstimate = taskToBreakdown.estimatedTime
                    ? taskToBreakdown.estimatedTime / breakdownSubtasks.length
                    : null;

                const newSubtasks = breakdownSubtasks.map((subtaskTitle, index) => ({
                    id: Date.now() + Math.random() + index,
                    title: subtaskTitle,
                    category: taskToBreakdown.category || 'Uncategorized',
                    energyRequired: taskToBreakdown.energyRequired || 'medium',
                    view: taskToBreakdown.view || 'later',
                    client: taskToBreakdown.client || '',
                    billable: taskToBreakdown.billable || false,
                    estimatedTime: subtaskEstimate,
                    parentTaskId: taskToBreakdown.id,
                    status: 'active',
                    createdDate: Date.now()
                }));

                // Update tasks: replace parent with updated parent, add all subtasks
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = currentTasks.map(t =>
                    t.id === taskToBreakdown.id ? updatedParent : t
                ).concat(newSubtasks);

                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Expand parent by default
                setExpandedParents({...expandedParents, [taskToBreakdown.id]: true});

                // Close modal
                setShowBreakdownModal(false);
                setTaskToBreakdown(null);
                setBreakdownSubtasks([]);
            };

            const detectCrisisMode = (text) => {
                const lowerText = text.toLowerCase();
                return CRISIS_KEYWORDS.some(keyword => lowerText.includes(keyword));
            };

            const parseCalendarInput = (input) => {
                if (!input || !input.trim()) return 0;

                let totalBusyHours = 0;
                const text = input.toLowerCase();

                // Match explicit hours like "3 hours", "3 hrs", "3h"
                const explicitHoursMatch = text.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\s+(?:in|of|for)?\s*(?:meetings?|calls?)?/gi);
                if (explicitHoursMatch) {
                    explicitHoursMatch.forEach(match => {
                        const hours = parseFloat(match.match(/(\d+(?:\.\d+)?)/)[1]);
                        totalBusyHours += hours;
                    });
                }

                // Match time ranges like "2-3pm", "9:30-11am", "2pm-4pm"
                const timeRangeRegex = /(\d{1,2})(?::(\d{2}))?\s*(?:am|pm)?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi;
                const timeRanges = text.matchAll(timeRangeRegex);

                for (const match of timeRanges) {
                    let startHour = parseInt(match[1]);
                    const startMin = match[2] ? parseInt(match[2]) : 0;
                    let endHour = parseInt(match[3]);
                    const endMin = match[4] ? parseInt(match[4]) : 0;
                    const period = match[5];

                    // Convert to 24-hour format
                    if (period === 'pm' && endHour !== 12) endHour += 12;
                    if (period === 'am' && endHour === 12) endHour = 0;
                    if (period === 'pm' && startHour < 12 && startHour < endHour - 12) startHour += 12;
                    if (period === 'am' && startHour === 12) startHour = 0;

                    const durationHours = (endHour + endMin / 60) - (startHour + startMin / 60);
                    if (durationHours > 0 && durationHours < 12) {
                        totalBusyHours += durationHours;
                    }
                }

                // Match individual hour mentions like "2pm", "3:30pm" (count as 1 hour each)
                if (totalBusyHours === 0) {
                    const singleTimes = text.match(/(?:^|[,;])\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)/gi);
                    if (singleTimes) {
                        totalBusyHours = singleTimes.length * 1; // Assume 1 hour per meeting mentioned
                    }
                }

                return Math.min(totalBusyHours, 16); // Cap at 16 hours to avoid nonsense
            };

            const parseTasks = (responseText) => {
                // Simple task parsing for Step 1
                // Just extract tasks that AI mentions with emoji markers
                const lines = responseText.split('\n');
                const foundTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    // Look for task markers
                    if (trimmed.startsWith('✅') || trimmed.startsWith('⏳') || trimmed.startsWith('📅')) {
                        const taskText = trimmed.replace(/^[✅⏳📅💬]\s*/, '').replace(/now:|soon:|later:|do now:|delay:|ask for help:/i, '').trim();
                        if (taskText && taskText.length > 3) {
                            foundTasks.push(taskText);
                        }
                    }
                });

                // Add found tasks to master list
                if (foundTasks.length > 0) {
                    const newTaskObjects = foundTasks.map(taskText => ({
                        id: Date.now() + Math.random(),
                        title: taskText,
                        category: 'From AI',
                        status: 'active',
                        createdDate: Date.now()
                    }));
                    const updatedTasks = [...tasks, ...newTaskObjects];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
                }
            };

            const switchMode = (newMode, isAuto = false) => {
                if (newMode !== currentMode) {
                    setCurrentMode(newMode);
                    localStorage.setItem('calmCommanderMode', newMode);

                    const modeMsg = {
                        role: 'system',
                        content: isAuto
                            ? `Switching to ${newMode} mode. I'm here...`
                            : `Switched to ${newMode} mode.`
                    };
                    const updatedMessages = [...messages, modeMsg];
                    setMessages(updatedMessages);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));
                }
            };

            const sendMessage = async () => {
                if (!inputMessage.trim() || isLoading) return;

                const userMsg = { role: 'user', content: inputMessage };
                const updatedMessages = [...messages, userMsg];
                setMessages(updatedMessages);
                localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));

                // Check for manual mode switch requests
                const lowerInput = inputMessage.toLowerCase();
                if (lowerInput.includes('back to normal mode') || lowerInput.includes('coach mode')) {
                    switchMode('coach');
                } else if (detectCrisisMode(inputMessage)) {
                    switchMode('crisis', true);
                }

                setInputMessage('');
                setIsLoading(true);

                // Build context about current tasks and state
                let context = '';

                // Add energy level if set today
                if (dailyEnergy && dailyEnergy.level) {
                    context += `\n\nCurrent energy level: ${dailyEnergy.level}\n`;
                }

                // Add calendar info if entered
                if (calendarInput && calendarInput.trim()) {
                    const busyHours = parseCalendarInput(calendarInput);
                    context += `\nCalendar today: ${calendarInput} (${busyHours.toFixed(1)}h in meetings/calls)\n`;
                }

                // Add active tasks grouped by view
                const activeTasks = tasks.filter(t => !completedTasks.some(ct => ct.id === t.id));

                if (activeTasks.length > 0) {
                    context += `\n--- CURRENT TASK LIST (${activeTasks.length} tasks) ---\n`;

                    const todayTasks = activeTasks.filter(t => t.view === 'today');
                    const thisWeekTasks = activeTasks.filter(t => t.view === 'thisweek');
                    const laterTasks = activeTasks.filter(t => t.view === 'later');

                    if (todayTasks.length > 0) {
                        context += `\nToday (${todayTasks.length}):\n`;
                        todayTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (thisWeekTasks.length > 0) {
                        context += `\nThis Week (${thisWeekTasks.length}):\n`;
                        thisWeekTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (laterTasks.length > 0) {
                        context += `\nLater (${laterTasks.length}):\n`;
                        laterTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            context += taskLine + '\n';
                        });
                    }
                    context += '--- END TASK LIST ---\n';
                }

                // Combine user message with context
                const messageWithContext = inputMessage + context;

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: messageWithContext,
                            mode: currentMode,
                            apiKey: apiKey
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const assistantMsg = { role: 'assistant', content: data.response };
                        const finalMessages = [...updatedMessages, assistantMsg];
                        setMessages(finalMessages);
                        localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));

                        // Parse tasks from response
                        parseTasks(data.response);
                    } else {
                        const errorMsg = {
                            role: 'system',
                            content: `Error: ${data.error || 'Failed to get response'}`
                        };
                        const finalMessages = [...updatedMessages, errorMsg];
                        setMessages(finalMessages);
                        localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));
                    }
                } catch (error) {
                    const errorMsg = {
                        role: 'system',
                        content: 'Connection error. Please check your internet and try again.'
                    };
                    const finalMessages = [...updatedMessages, errorMsg];
                    setMessages(finalMessages);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));
                }

                setIsLoading(false);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            if (!isSetup) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>Calm Commander</h1>
                        </div>
                        <div className="content">
                            <div className="setup-screen">
                                <h2>Welcome to Calm Commander</h2>
                                <p>An AI coach designed specifically for people with ADHD and autism.</p>

                                <div className="info-box">
                                    Get your API key at console.anthropic.com. It stays private on your device.
                                </div>

                                <div className="input-group">
                                    <label htmlFor="apiKey">Anthropic API Key</label>
                                    <input
                                        id="apiKey"
                                        type="password"
                                        value={apiKey}
                                        onChange={(e) => setApiKey(e.target.value)}
                                        placeholder="sk-ant-..."
                                        onKeyPress={(e) => e.key === 'Enter' && handleSetup()}
                                    />
                                </div>

                                <button className="btn-primary" onClick={handleSetup}>
                                    Start Using Calm Commander
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>Calm Commander</h1>
                        <div className={`mode-badge ${currentMode}`}>
                            {currentMode === 'coach' ? '🧘 Coach Mode' : '🚨 Crisis Mode'}
                        </div>
                        <div className="mode-buttons">
                            <button
                                className={`mode-btn coach ${currentMode === 'coach' ? 'active' : ''}`}
                                onClick={() => switchMode('coach')}
                            >
                                Coach Mode
                            </button>
                            <button
                                className={`mode-btn crisis ${currentMode === 'crisis' ? 'active' : ''}`}
                                onClick={() => switchMode('crisis')}
                            >
                                Crisis Mode
                            </button>
                        </div>
                    </div>

                    <div className="content">
                        {/* Energy Check-in Panel */}
                        <div style={{
                            background: '#f9fafb',
                            border: '2px solid #e5e7eb',
                            borderRadius: '8px',
                            padding: '20px',
                            marginBottom: '20px'
                        }}>
                            {!dailyEnergy ? (
                                <div>
                                    <h3 style={{fontSize: '16px', marginBottom: '12px', color: '#333'}}>
                                        What's your energy level today?
                                    </h3>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <button
                                            onClick={() => setEnergy('low')}
                                            style={{
                                                flex: 1,
                                                padding: '10px',
                                                border: '2px solid #e5e7eb',
                                                borderRadius: '8px',
                                                background: 'white',
                                                cursor: 'pointer',
                                                fontWeight: 600
                                            }}
                                        >
                                            Low
                                        </button>
                                        <button
                                            onClick={() => setEnergy('medium')}
                                            style={{
                                                flex: 1,
                                                padding: '10px',
                                                border: '2px solid #e5e7eb',
                                                borderRadius: '8px',
                                                background: 'white',
                                                cursor: 'pointer',
                                                fontWeight: 600
                                            }}
                                        >
                                            Medium
                                        </button>
                                        <button
                                            onClick={() => setEnergy('high')}
                                            style={{
                                                flex: 1,
                                                padding: '10px',
                                                border: '2px solid #e5e7eb',
                                                borderRadius: '8px',
                                                background: 'white',
                                                cursor: 'pointer',
                                                fontWeight: 600
                                            }}
                                        >
                                            High
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <h3 style={{fontSize: '16px', marginBottom: '12px', color: '#333'}}>
                                        Today's Energy: <span style={{textTransform: 'capitalize', fontWeight: 'bold'}}>{dailyEnergy.level}</span>
                                    </h3>
                                    <button
                                        onClick={() => {
                                            setDailyEnergy(null);
                                            localStorage.removeItem('ccDailyEnergy');
                                        }}
                                        style={{
                                            padding: '8px 16px',
                                            background: '#6b7280',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontSize: '14px',
                                            fontWeight: 600
                                        }}
                                    >
                                        Update Energy
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Calendar Input */}
                        <div style={{
                            background: '#f9fafb',
                            border: '2px solid #e5e7eb',
                            borderRadius: '8px',
                            padding: '20px',
                            marginBottom: '20px'
                        }}>
                            <h3 style={{fontSize: '16px', marginBottom: '12px', color: '#333'}}>
                                What's on your calendar today?
                            </h3>
                            <input
                                type="text"
                                value={calendarInput}
                                onChange={(e) => setCalendarInput(e.target.value)}
                                placeholder="e.g., Client call 2-3pm, team meeting 4pm, or '3 hours in meetings'"
                                style={{
                                    width: '100%',
                                    padding: '10px 12px',
                                    borderRadius: '6px',
                                    border: '2px solid #e5e7eb',
                                    fontSize: '14px'
                                }}
                            />
                            <p style={{fontSize: '12px', color: '#6b7280', marginTop: '8px'}}>
                                This helps calculate your available work time
                            </p>
                        </div>

                        {/* Bulk Upload and Billing Buttons */}
                        <div style={{marginBottom: '20px', textAlign: 'center', display: 'flex', gap: '10px', justifyContent: 'center'}}>
                            <div style={{flex: 1, maxWidth: '300px'}}>
                                <button
                                    onClick={() => setShowBulkUploadModal(true)}
                                    style={{
                                        width: '100%',
                                        padding: '12px 24px',
                                        background: '#667eea',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '8px',
                                        fontSize: '15px',
                                        fontWeight: 600,
                                        cursor: 'pointer'
                                    }}
                                >
                                    Bulk Upload Tasks
                                </button>
                                <p style={{fontSize: '12px', color: '#6b7280', marginTop: '8px'}}>
                                    Paste your entire task list
                                </p>
                            </div>
                            <div style={{flex: 1, maxWidth: '300px'}}>
                                <button
                                    onClick={() => setShowBillingView(true)}
                                    style={{
                                        width: '100%',
                                        padding: '12px 24px',
                                        background: '#10b981',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '8px',
                                        fontSize: '15px',
                                        fontWeight: 600,
                                        cursor: 'pointer'
                                    }}
                                >
                                    View Billing
                                </button>
                                <p style={{fontSize: '12px', color: '#6b7280', marginTop: '8px'}}>
                                    Hours by client for invoicing
                                </p>
                            </div>
                        </div>

                        {/* Quick Add Task Buttons */}
                        <div style={{marginBottom: '20px'}}>
                            <h4 style={{fontSize: '14px', marginBottom: '10px', color: '#333'}}>Add Task:</h4>
                            <div style={{display: 'flex', gap: '10px'}}>
                                <button
                                    style={{
                                        flex: 1,
                                        padding: '10px',
                                        background: '#fee2e2',
                                        color: '#991b1b',
                                        border: '2px solid #ef4444',
                                        borderRadius: '8px',
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        fontSize: '13px'
                                    }}
                                    onClick={() => {
                                        const taskTitle = prompt('Task name:');
                                        if (taskTitle && taskTitle.trim()) {
                                            const client = prompt('Client name (or leave blank):') || '';
                                            const billable = client ? confirm('Is this billable work?') : false;
                                            setPendingTask({
                                                title: taskTitle.trim(),
                                                category: 'Uncategorized',
                                                energyRequired: 'low',
                                                view: 'later',
                                                client: client.trim(),
                                                billable: billable
                                            });
                                            setShowEstimateModal(true);
                                        }
                                    }}
                                >
                                    + Low Energy
                                </button>
                                <button
                                    style={{
                                        flex: 1,
                                        padding: '10px',
                                        background: '#fef3c7',
                                        color: '#92400e',
                                        border: '2px solid #f59e0b',
                                        borderRadius: '8px',
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        fontSize: '13px'
                                    }}
                                    onClick={() => {
                                        const taskTitle = prompt('Task name:');
                                        if (taskTitle && taskTitle.trim()) {
                                            const client = prompt('Client name (or leave blank):') || '';
                                            const billable = client ? confirm('Is this billable work?') : false;
                                            setPendingTask({
                                                title: taskTitle.trim(),
                                                category: 'Uncategorized',
                                                energyRequired: 'medium',
                                                view: 'later',
                                                client: client.trim(),
                                                billable: billable
                                            });
                                            setShowEstimateModal(true);
                                        }
                                    }}
                                >
                                    + Medium Energy
                                </button>
                                <button
                                    style={{
                                        flex: 1,
                                        padding: '10px',
                                        background: '#d1fae5',
                                        color: '#065f46',
                                        border: '2px solid #22c55e',
                                        borderRadius: '8px',
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        fontSize: '13px'
                                    }}
                                    onClick={() => {
                                        const taskTitle = prompt('Task name:');
                                        if (taskTitle && taskTitle.trim()) {
                                            const client = prompt('Client name (or leave blank):') || '';
                                            const billable = client ? confirm('Is this billable work?') : false;
                                            setPendingTask({
                                                title: taskTitle.trim(),
                                                category: 'Uncategorized',
                                                energyRequired: 'high',
                                                view: 'later',
                                                client: client.trim(),
                                                billable: billable
                                            });
                                            setShowEstimateModal(true);
                                        }
                                    }}
                                >
                                    + High Energy
                                </button>
                            </div>
                        </div>

                        <div className="chat-container">
                            {messages.map((msg, index) => (
                                <div key={index} className={`message ${msg.role}`}>
                                    {msg.content}
                                </div>
                            ))}
                            {isLoading && (
                                <div className="message assistant">
                                    Thinking...
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        <div className="input-area">
                            <input
                                type="text"
                                value={inputMessage}
                                onChange={(e) => setInputMessage(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="What's on your mind?"
                                disabled={isLoading}
                            />
                            <button onClick={sendMessage} disabled={isLoading || !inputMessage.trim()}>
                                Send
                            </button>
                        </div>

                        {/* View Tabs + Task List */}
                        {tasks.length > 0 && (() => {
                            // First filter by view
                            const tasksInView = tasks.filter(t => t.view === currentView);

                            // Then filter by energy
                            const filterTasksByEnergy = (taskList) => {
                                if (!dailyEnergy) return taskList; // No energy set, show all

                                const energyLevels = { low: 1, medium: 2, high: 3 };
                                const userEnergyLevel = energyLevels[dailyEnergy.level];

                                return taskList.filter(task => {
                                    const taskEnergyLevel = energyLevels[task.energyRequired || 'medium'];
                                    return taskEnergyLevel <= userEnergyLevel;
                                });
                            };

                            const filteredTasks = filterTasksByEnergy(tasksInView);
                            const hiddenCount = tasksInView.length - filteredTasks.length;

                            // Count tasks per view
                            const todayCount = tasks.filter(t => t.view === 'today').length;
                            const weekCount = tasks.filter(t => t.view === 'this-week').length;
                            const laterCount = tasks.filter(t => t.view === 'later').length;

                            return (
                                <div className="tasks-section">
                                    {/* View Tabs */}
                                    <div style={{
                                        display: 'flex',
                                        gap: '8px',
                                        marginBottom: '20px',
                                        borderBottom: '2px solid #e5e7eb',
                                        paddingBottom: '10px'
                                    }}>
                                        <button
                                            onClick={() => setCurrentView('today')}
                                            style={{
                                                padding: '8px 16px',
                                                background: 'transparent',
                                                border: 'none',
                                                borderBottom: currentView === 'today' ? '3px solid #667eea' : '3px solid transparent',
                                                fontSize: '15px',
                                                fontWeight: 600,
                                                color: currentView === 'today' ? '#667eea' : '#6b7280',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            Today ({todayCount})
                                        </button>
                                        <button
                                            onClick={() => setCurrentView('this-week')}
                                            style={{
                                                padding: '8px 16px',
                                                background: 'transparent',
                                                border: 'none',
                                                borderBottom: currentView === 'this-week' ? '3px solid #667eea' : '3px solid transparent',
                                                fontSize: '15px',
                                                fontWeight: 600,
                                                color: currentView === 'this-week' ? '#667eea' : '#6b7280',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            This Week ({weekCount})
                                        </button>
                                        <button
                                            onClick={() => setCurrentView('later')}
                                            style={{
                                                padding: '8px 16px',
                                                background: 'transparent',
                                                border: 'none',
                                                borderBottom: currentView === 'later' ? '3px solid #667eea' : '3px solid transparent',
                                                fontSize: '15px',
                                                fontWeight: 600,
                                                color: currentView === 'later' ? '#667eea' : '#6b7280',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            Later ({laterCount})
                                        </button>
                                    </div>

                                    <h3 style={{marginBottom: '15px'}}>
                                        {currentView === 'today' ? 'Today' : currentView === 'this-week' ? 'This Week' : 'Later'}
                                        {' '}({filteredTasks.length} task{filteredTasks.length !== 1 ? 's' : ''} {dailyEnergy && `for ${dailyEnergy.level} energy`})
                                    </h3>

                                    {hiddenCount > 0 && dailyEnergy && (
                                        <div style={{
                                            background: '#fef3c7',
                                            padding: '10px',
                                            borderRadius: '6px',
                                            marginBottom: '15px',
                                            fontSize: '14px',
                                            color: '#78350f'
                                        }}>
                                            {hiddenCount} task{hiddenCount > 1 ? 's' : ''} hidden (requires more energy than you have today)
                                        </div>
                                    )}

                                    {/* Time Summary for Today view */}
                                    {currentView === 'today' && (() => {
                                        const totalEstimated = filteredTasks.reduce((sum, task) => {
                                            return sum + (task.estimatedTime || 0);
                                        }, 0);

                                        const busyHours = parseCalendarInput(calendarInput);
                                        const workdayHours = 8; // Assuming 8-hour workday
                                        const availableHours = workdayHours - busyHours;

                                        if (totalEstimated === 0 && busyHours === 0) return null;

                                        const isOvercommitted = totalEstimated > availableHours && availableHours > 0;
                                        const isVeryOvercommitted = totalEstimated > workdayHours;

                                        return (
                                            <div style={{
                                                background: isVeryOvercommitted ? '#fee2e2' : isOvercommitted ? '#fef3c7' : '#e0e7ff',
                                                padding: '15px',
                                                borderRadius: '8px',
                                                marginBottom: '15px',
                                                border: `2px solid ${isVeryOvercommitted ? '#ef4444' : isOvercommitted ? '#f59e0b' : '#667eea'}`
                                            }}>
                                                {busyHours > 0 && (
                                                    <div style={{fontSize: '14px', marginBottom: '8px'}}>
                                                        <strong>Calendar:</strong> {busyHours.toFixed(1)} hours in meetings/calls
                                                    </div>
                                                )}
                                                {busyHours > 0 && (
                                                    <div style={{fontSize: '14px', marginBottom: '8px', color: '#059669'}}>
                                                        <strong>Available for tasks:</strong> {availableHours.toFixed(1)} hours
                                                    </div>
                                                )}
                                                {totalEstimated > 0 && (
                                                    <div style={{fontSize: '14px', marginBottom: '5px'}}>
                                                        <strong>Task time estimate:</strong> {totalEstimated.toFixed(1)} hours
                                                    </div>
                                                )}
                                                {isVeryOvercommitted && (
                                                    <div style={{fontSize: '13px', color: '#991b1b', marginTop: '8px'}}>
                                                        ⚠️ <strong>Seriously overcommitted!</strong> You have {totalEstimated.toFixed(1)}h of tasks but only {availableHours > 0 ? availableHours.toFixed(1) : 0}h available. Move tasks to "This Week" or "Later".
                                                    </div>
                                                )}
                                                {isOvercommitted && !isVeryOvercommitted && (
                                                    <div style={{fontSize: '13px', color: '#92400e', marginTop: '8px'}}>
                                                        ⚠️ You might be overcommitted - {totalEstimated.toFixed(1)}h of tasks with only {availableHours.toFixed(1)}h available.
                                                    </div>
                                                )}
                                                {!isOvercommitted && totalEstimated > 4 && availableHours > 0 && (
                                                    <div style={{fontSize: '13px', color: '#3730a3', marginTop: '8px'}}>
                                                        This is a full day, but manageable. You have {availableHours.toFixed(1)}h available.
                                                    </div>
                                                )}
                                                {!isOvercommitted && totalEstimated <= 4 && busyHours > 0 && (
                                                    <div style={{fontSize: '13px', color: '#059669', marginTop: '8px'}}>
                                                        ✓ Good balance - {totalEstimated.toFixed(1)}h of tasks with {availableHours.toFixed(1)}h available.
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}

                                    {Object.entries(
                                        filteredTasks.reduce((acc, task) => {
                                            const cat = task.category || 'Uncategorized';
                                            if (!acc[cat]) acc[cat] = [];
                                            acc[cat].push(task);
                                            return acc;
                                        }, {})
                                    ).map(([category, categoryTasks]) => {
                                        // Separate parent tasks and subtasks
                                        const parentTasks = categoryTasks.filter(t => !t.parentTaskId);
                                        const subtasksByParent = categoryTasks
                                            .filter(t => t.parentTaskId)
                                            .reduce((acc, task) => {
                                                if (!acc[task.parentTaskId]) acc[task.parentTaskId] = [];
                                                acc[task.parentTaskId].push(task);
                                                return acc;
                                            }, {});

                                        const renderTask = (task, isSubtask = false) => {
                                            const subtasks = subtasksByParent[task.id] || [];
                                            const completedSubtasks = subtasks.filter(st =>
                                                completedTasks.some(ct => ct.id === st.id)
                                            ).length;
                                            const isExpanded = expandedParents[task.id];

                                            return (
                                                <React.Fragment key={task.id}>
                                                    <li className="task-item now" style={{
                                                        display: 'flex',
                                                        justifyContent: 'space-between',
                                                        alignItems: 'center',
                                                        marginLeft: isSubtask ? '30px' : '0',
                                                        background: isSubtask ? '#fafafa' : '#f9fafb',
                                                        borderLeft: isSubtask ? '3px solid #d1d5db' : '4px solid'
                                                    }}>
                                                        <div style={{flex: 1}}>
                                                            {task.hasSubtasks && (
                                                                <button
                                                                    onClick={() => setExpandedParents({
                                                                        ...expandedParents,
                                                                        [task.id]: !isExpanded
                                                                    })}
                                                                    style={{
                                                                        background: 'transparent',
                                                                        border: 'none',
                                                                        cursor: 'pointer',
                                                                        marginRight: '8px',
                                                                        fontSize: '14px',
                                                                        padding: '0'
                                                                    }}
                                                                >
                                                                    {isExpanded ? '▼' : '▶'}
                                                                </button>
                                                            )}
                                                            <span>{task.title}</span>
                                                            {task.hasSubtasks && (
                                                                <span style={{
                                                                    marginLeft: '8px',
                                                                    fontSize: '11px',
                                                                    padding: '2px 6px',
                                                                    borderRadius: '4px',
                                                                    background: completedSubtasks === subtasks.length ? '#d1fae5' : '#e0e7ff',
                                                                    color: completedSubtasks === subtasks.length ? '#065f46' : '#3730a3',
                                                                    fontWeight: 600
                                                                }}>
                                                                    {completedSubtasks}/{subtasks.length} done
                                                                </span>
                                                            )}
                                                            <span style={{
                                                                marginLeft: '10px',
                                                                fontSize: '11px',
                                                                padding: '2px 6px',
                                                                borderRadius: '4px',
                                                                background: task.energyRequired === 'low' ? '#fee2e2' : task.energyRequired === 'high' ? '#d1fae5' : '#fef3c7',
                                                                color: task.energyRequired === 'low' ? '#991b1b' : task.energyRequired === 'high' ? '#065f46' : '#92400e'
                                                            }}>
                                                                {task.energyRequired || 'medium'} energy
                                                            </span>
                                                            {task.client && (
                                                                <span style={{
                                                                    marginLeft: '8px',
                                                                    fontSize: '11px',
                                                                    padding: '2px 6px',
                                                                    borderRadius: '4px',
                                                                    background: '#e0e7ff',
                                                                    color: '#3730a3',
                                                                    fontWeight: 600
                                                                }}>
                                                                    {task.client}
                                                                </span>
                                                            )}
                                                            {task.billable && (
                                                                <span style={{
                                                                    marginLeft: '6px',
                                                                    fontSize: '11px',
                                                                    padding: '2px 6px',

                            }} onClick={() => !isBreakingDown && setShowBreakdownModal(false)}>
                                <div style={{
                                    background: 'white',
                                    borderRadius: '16px',
                                    padding: '30px',
                                    maxWidth: '600px',
                                    width: '90%',
                                    maxHeight: '80vh',
                                    overflowY: 'auto'
                                }} onClick={(e) => e.stopPropagation()}>
                                    <h3 style={{marginBottom: '15px', color: '#333'}}>Break Down Task</h3>
                                    <p style={{marginBottom: '15px', padding: '12px', background: '#f9fafb', borderRadius: '8px', fontSize: '15px'}}>
                                        <strong>{taskToBreakdown.title}</strong>
                                    </p>

                                    {isBreakingDown ? (
                                        <div style={{textAlign: 'center', padding: '40px 20px'}}>
                                            <p style={{fontSize: '16px', color: '#6b7280', marginBottom: '10px'}}>
                                                Breaking this down into smaller steps...
                                            </p>
                                            <p style={{fontSize: '14px', color: '#9ca3af'}}>
                                                The AI is thinking...
                                            </p>
                                        </div>
                                    ) : breakdownSubtasks.length > 0 ? (
                                        <div>
                                            <h4 style={{fontSize: '15px', marginBottom: '12px', color: '#333'}}>
                                                Suggested Steps:
                                            </h4>
                                            <ol style={{marginBottom: '20px', paddingLeft: '24px'}}>
                                                {breakdownSubtasks.map((subtask, index) => (
                                                    <li key={index} style={{
                                                        marginBottom: '8px',
                                                        fontSize: '14px',
                                                        lineHeight: '1.5',
                                                        color: '#374151'
                                                    }}>
                                                        {subtask}
                                                    </li>
                                                ))}
                                            </ol>
                                            <div style={{display: 'flex', gap: '10px', justifyContent: 'flex-end'}}>
                                                <button
                                                    onClick={() => {
                                                        setShowBreakdownModal(false);
                                                        setTaskToBreakdown(null);
                                                        setBreakdownSubtasks([]);
                                                    }}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#6b7280',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Cancel
                                                </button>
                                                <button
                                                    onClick={addSubtasksToList}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#8b5cf6',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Add These Steps as Tasks
                                                </button>
                                            </div>
                                        </div>
                                    ) : null}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
