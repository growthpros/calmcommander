                                        />
                                    </div>

                                    {(() => {
                                        // Filter completed tasks for selected month
                                        const [year, month] = billingMonth.split('-');
                                        const startDate = new Date(year, month - 1, 1).getTime();
                                        const endDate = new Date(year, month, 0, 23, 59, 59).getTime();

                                        const monthTasks = completedTasks.filter(task => {
                                            return task.completedDate >= startDate && task.completedDate <= endDate;
                                        });

                                        // Group by client
                                        const byClient = {};
                                        let totalHours = 0;
                                        let billableHours = 0;

                                        monthTasks.forEach(task => {
                                            const clientName = task.client || 'No Client';
                                            const hours = parseFloat(task.actualTime) || 0;

                                            if (!byClient[clientName]) {
                                                byClient[clientName] = {
                                                    tasks: [],
                                                    totalHours: 0,
                                                    billableHours: 0
                                                };
                                            }

                                            byClient[clientName].tasks.push(task);
                                            byClient[clientName].totalHours += hours;

                                            if (task.billable) {
                                                byClient[clientName].billableHours += hours;
                                                billableHours += hours;
                                            }

                                            totalHours += hours;
                                        });

                                        const clients = Object.keys(byClient).sort();

                                        return (
                                            <div>
                                                {/* Summary */}
                                                <div style={{
                                                    background: '#f9fafb',
                                                    padding: '15px',
                                                    borderRadius: '8px',
                                                    marginBottom: '20px',
                                                    border: '2px solid #e5e7eb'
                                                }}>
                                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '8px'}}>
                                                        <span style={{fontWeight: 600}}>Total Hours:</span>
                                                        <span style={{fontSize: '18px', fontWeight: 700, color: '#333'}}>
                                                            {totalHours.toFixed(2)}h
                                                        </span>
                                                    </div>
                                                    <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                                        <span style={{fontWeight: 600, color: '#065f46'}}>Billable Hours:</span>
                                                        <span style={{fontSize: '18px', fontWeight: 700, color: '#065f46'}}>
                                                            {billableHours.toFixed(2)}h
                                                        </span>
                                                    </div>
                                                </div>

                                                {clients.length === 0 ? (
                                                    <p style={{textAlign: 'center', color: '#6b7280', padding: '40px'}}>
                                                        No completed tasks for this month
                                                    </p>
                                                ) : (
                                                    clients.map(clientName => {
                                                        const client = byClient[clientName];
                                                        return (
                                                            <div key={clientName} style={{
                                                                marginBottom: '20px',
                                                                border: '1px solid #e5e7eb',
                                                                borderRadius: '8px',
                                                                overflow: 'hidden'
                                                            }}>
                                                                <div style={{
                                                                    background: '#f3f4f6',
                                                                    padding: '12px 15px',
                                                                    borderBottom: '1px solid #e5e7eb'
                                                                }}>
                                                                    <h4 style={{margin: 0, fontSize: '16px', color: '#333'}}>
                                                                        {clientName}
                                                                    </h4>
                                                                    <div style={{fontSize: '13px', color: '#6b7280', marginTop: '4px'}}>
                                                                        Total: {client.totalHours.toFixed(2)}h
                                                                        {client.billableHours > 0 && (
                                                                            <span style={{marginLeft: '12px', color: '#065f46', fontWeight: 600}}>
                                                                                Billable: {client.billableHours.toFixed(2)}h
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                                <div style={{padding: '15px'}}>
                                                                    {client.tasks.map(task => {
                                                                        const completedDate = new Date(task.completedDate);
                                                                        const dateStr = completedDate.toLocaleDateString('en-US', {
                                                                            month: 'short',
                                                                            day: 'numeric'
                                                                        });
                                                                        return (
                                                                            <div key={task.id} style={{
                                                                                marginBottom: '8px',
                                                                                paddingBottom: '8px',
                                                                                borderBottom: '1px solid #f3f4f6',
                                                                                fontSize: '14px'
                                                                            }}>
                                                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start'}}>
                                                                                    <div style={{flex: 1}}>
                                                                                        <span
                                                                                            style={{
                                                                                                cursor: 'pointer',
                                                                                                borderBottom: '1px dashed transparent'
                                                                                            }}
                                                                                            onMouseEnter={(e) => e.target.style.borderBottomColor = '#9ca3af'}
                                                                                            onMouseLeave={(e) => e.target.style.borderBottomColor = 'transparent'}
                                                                                            onClick={() => {
                                                                                                const newTitle = prompt('Edit task description:', task.title);
                                                                                                if (newTitle !== null && newTitle.trim() !== '') {
                                                                                                    updateCompletedTask(task.id, 'title', newTitle.trim());
                                                                                                }
                                                                                            }}
                                                                                            title="Click to edit task description"
                                                                                        >
                                                                                            {task.title}
                                                                                        </span>
                                                                                        <div style={{
                                                                                            fontSize: '12px',
                                                                                            color: '#6b7280',
                                                                                            marginTop: '2px'
                                                                                        }}>
                                                                                            {dateStr} •
                                                                                            <span
                                                                                                style={{
                                                                                                    cursor: 'pointer',
                                                                                                    marginLeft: '4px',
                                                                                                    borderBottom: '1px dashed transparent'
                                                                                                }}
                                                                                                onMouseEnter={(e) => e.target.style.borderBottomColor = '#9ca3af'}
                                                                                                onMouseLeave={(e) => e.target.style.borderBottomColor = 'transparent'}
                                                                                                onClick={() => {
                                                                                                    const newClient = prompt('Edit client name:', task.client || 'Personal');
                                                                                                    if (newClient !== null) {
                                                                                                        updateCompletedTask(task.id, 'client', newClient.trim());
                                                                                                    }
                                                                                                }}
                                                                                                title="Click to edit client"
                                                                                            >
                                                                                                {task.client || 'Personal'}
                                                                                            </span>
                                                                                        </div>
                                                                                    </div>
                                                                                    <span
                                                                                        style={{
                                                                                            fontWeight: 600,
                                                                                            marginLeft: '12px',
                                                                                            cursor: 'pointer',
                                                                                            borderBottom: '1px dashed transparent'
                                                                                        }}
                                                                                        onMouseEnter={(e) => e.target.style.borderBottomColor = '#9ca3af'}
                                                                                        onMouseLeave={(e) => e.target.style.borderBottomColor = 'transparent'}
                                                                                        onClick={() => {
                                                                                            const newTime = prompt('Edit actual time (in hours, e.g., 0.25, 0.5, 1, 2):', task.actualTime);
                                                                                            if (newTime !== null && !isNaN(newTime) && parseFloat(newTime) > 0) {
                                                                                                updateCompletedTask(task.id, 'actualTime', newTime);
                                                                                            }
                                                                                        }}
                                                                                        title="Click to edit time"
                                                                                    >
                                                                                        {parseFloat(task.actualTime).toFixed(2)}h
                                                                                    </span>
                                                                                </div>
                                                                                <span
                                                                                    style={{
                                                                                        fontSize: '11px',
                                                                                        padding: '2px 6px',
                                                                                        borderRadius: '4px',
                                                                                        background: task.billable ? '#d1fae5' : '#f3f4f6',
                                                                                        color: task.billable ? '#065f46' : '#6b7280',
                                                                                        fontWeight: 600,
                                                                                        cursor: 'pointer',
                                                                                        display: 'inline-block',
                                                                                        marginTop: '4px'
                                                                                    }}
                                                                                    onClick={() => {
                                                                                        updateCompletedTask(task.id, 'billable', !task.billable);
                                                                                    }}
                                                                                    title="Click to toggle billable status"
                                                                                >
                                                                                    {task.billable ? '$ Billable' : 'Non-billable'}
                                                                                </span>
                                                                        </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })
                                                )}

                                                <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: '20px'}}>
                                                    <button
                                                        onClick={() => setShowBillingView(false)}
                                                        style={{
                                                            padding: '10px 20px',
                                                            background: '#6b7280',
                                                            color: 'white',
                                                            border: 'none',
                                                            borderRadius: '8px',
                                                            cursor: 'pointer',
                                                            fontWeight: 600
                                                        }}
                                                    >
                                                        Close
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {/* Task Breakdown Modal */}
                        {showBreakdownModal && taskToBreakdown && (
                            <div style={{
                                position: 'fixed',
                                top: 0,
                                left: 0,
                                right: 0,
                                bottom: 0,
                                background: 'rgba(0, 0, 0, 0.5)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                zIndex: 1000
                            }} onClick={() => !isBreakingDown && setShowBreakdownModal(false)}>
                                <div style={{
                                    background: 'white',
                                    borderRadius: '16px',
                                    padding: '30px',
                                    maxWidth: '600px',
                                    width: '90%',
                                    maxHeight: '80vh',
                                    overflowY: 'auto'
                                }} onClick={(e) => e.stopPropagation()}>
                                    <h3 style={{marginBottom: '15px', color: '#333'}}>Break Down Task</h3>
                                    <p style={{marginBottom: '15px', padding: '12px', background: '#f9fafb', borderRadius: '8px', fontSize: '15px'}}>
                                        <strong>{taskToBreakdown.title}</strong>
                                    </p>

                                    {isBreakingDown ? (
                                        <div style={{textAlign: 'center', padding: '40px 20px'}}>
                                            <p style={{fontSize: '16px', color: '#6b7280', marginBottom: '10px'}}>
                                                Breaking this down into smaller steps...
                                            </p>
                                            <p style={{fontSize: '14px', color: '#9ca3af'}}>
                                                The AI is thinking...
                                            </p>
                                        </div>
                                    ) : breakdownSubtasks.length > 0 ? (
                                        <div>
                                            <h4 style={{fontSize: '15px', marginBottom: '12px', color: '#333'}}>
                                                Suggested Steps:
                                            </h4>
                                            <ol style={{marginBottom: '20px', paddingLeft: '24px'}}>
                                                {breakdownSubtasks.map((subtask, index) => (
                                                    <li key={index} style={{
                                                        marginBottom: '8px',
                                                        fontSize: '14px',
                                                        lineHeight: '1.5',
                                                        color: '#374151'
                                                    }}>
                                                        {subtask}
                                                    </li>
                                                ))}
                                            </ol>
                                            <div style={{display: 'flex', gap: '10px', justifyContent: 'flex-end'}}>
                                                <button
                                                    onClick={() => {
                                                        setShowBreakdownModal(false);
                                                        setTaskToBreakdown(null);
                                                        setBreakdownSubtasks([]);
                                                    }}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#6b7280',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Cancel
                                                </button>
                                                <button
                                                    onClick={addSubtasksToList}
                                                    style={{
                                                        padding: '10px 20px',
                                                        background: '#8b5cf6',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        fontWeight: 600
                                                    }}
                                                >
                                                    Add These Steps as Tasks
                                                </button>
                                            </div>
                                        </div>
                                    ) : null}
                                </div>
                            </div>
                        )}

                        {/* Neuro-Check Modal */}
                        <NeuroCheckModal
                            isOpen={showNeuroCheck}
                            onClose={() => setShowNeuroCheck(false)}
                            onComplete={(capacityData) => {
                                setDailyCapacity(capacityData);
                                setShowNeuroCheck(false);
                            }}
                        />

                        {/* Override Safety Modals */}
                        <OverrideModal
                            isOpen={showOverrideModal}
                            onClose={() => {
                                setShowOverrideModal(false);
                                setTaskPendingOverride(null);
                            }}
                            task={taskPendingOverride}
                            remainingSpoons={dailyCapacity.remainingSpoons}
                            onConfirm={handleOverrideConfirm}
                        />

                        <WeeklyLimitModal
                            isOpen={showWeeklyLimitModal}
                            onClose={() => {
                                setShowWeeklyLimitModal(false);
                                setTaskPendingOverride(null);
                            }}
                            onSwitchToCrisis={() => setShowCrisisModeModal(true)}
                            task={taskPendingOverride}
                        />

                        <CrisisModeModal
                            isOpen={showCrisisModeModal}
                            onClose={() => setShowCrisisModeModal(false)}
                            onActivate={activateCrisisMode}
                        />

                        {/* Advanced Add Task Modal */}
                        <AdvancedAddTaskModal
                            isOpen={showAdvancedAddTask}
                            onClose={() => setShowAdvancedAddTask(false)}
                            onAdd={() => {
                                addTask(
                                    newTaskTitle,
                                    newTaskCategory,
                                    newTaskEnergy,
                                    newTaskView,
                                    newTaskClient,
                                    newTaskBillable,
                                    null, // estimatedTime - let AI estimate
                                    'medium', // priority - default
                                    newTaskUrgency,
                                    newTaskFocusLevel,
                                    newTaskWaitingFor,
                                    newTaskDueDate
                                );
                            }}
                            newTaskTitle={newTaskTitle}
                            setNewTaskTitle={setNewTaskTitle}
                            newTaskCategory={newTaskCategory}
                            setNewTaskCategory={setNewTaskCategory}
                            newTaskEnergy={newTaskEnergy}
                            setNewTaskEnergy={setNewTaskEnergy}
                            newTaskView={newTaskView}
                            setNewTaskView={setNewTaskView}
                            newTaskClient={newTaskClient}
                            setNewTaskClient={setNewTaskClient}
                            newTaskBillable={newTaskBillable}
                            setNewTaskBillable={setNewTaskBillable}
                            newTaskUrgency={newTaskUrgency}
                            setNewTaskUrgency={setNewTaskUrgency}
                            newTaskFocusLevel={newTaskFocusLevel}
                            setNewTaskFocusLevel={setNewTaskFocusLevel}
                            newTaskWaitingFor={newTaskWaitingFor}
                            setNewTaskWaitingFor={setNewTaskWaitingFor}
                            newTaskDueDate={newTaskDueDate}
                            setNewTaskDueDate={setNewTaskDueDate}
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
