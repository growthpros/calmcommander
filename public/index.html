            const [bulkUploadBillable, setBulkUploadBillable] = useState(false);
            const [showBreakdownModal, setShowBreakdownModal] = useState(false);
            const [taskToBreakdown, setTaskToBreakdown] = useState(null);
            const [breakdownSubtasks, setBreakdownSubtasks] = useState([]);
            const [isBreakingDown, setIsBreakingDown] = useState(false);
            const [showBillingView, setShowBillingView] = useState(false);
            const [expandedParents, setExpandedParents] = useState({});
            const [showEstimateModal, setShowEstimateModal] = useState(false);
            const [pendingTask, setPendingTask] = useState(null);
            const [showAddTask, setShowAddTask] = useState(false);
            const [showAdvancedAddTask, setShowAdvancedAddTask] = useState(false);

            // Advanced task form states
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskCategory, setNewTaskCategory] = useState('Uncategorized');
            const [newTaskEnergy, setNewTaskEnergy] = useState('medium');
            const [newTaskView, setNewTaskView] = useState('later');
            const [newTaskClient, setNewTaskClient] = useState('');
            const [newTaskBillable, setNewTaskBillable] = useState(false);
            const [newTaskUrgency, setNewTaskUrgency] = useState('normal');
            const [newTaskFocusLevel, setNewTaskFocusLevel] = useState('medium');
            const [newTaskWaitingFor, setNewTaskWaitingFor] = useState('');
            const [newTaskDueDate, setNewTaskDueDate] = useState('');

            const [billingMonth, setBillingMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });

            // Neuro-check state
            const [showNeuroCheck, setShowNeuroCheck] = useState(false);
            const [dailyCapacity, setDailyCapacity] = useState(() => {
                const today = new Date().toISOString().split('T')[0];
                const stored = localStorage.getItem(`calm-neuro-check-${today}`);
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        return {
                            date: today,
                            moodLevel: null,
                            energyUnits: null,
                            brainMode: null,
                            burnoutFlags: [],
                            totalSpoons: 0,
                            remainingSpoons: 0,
                            quickBoostersUsed: [],
                            adjustments: {},
                            completedAt: null
                        };
                    }
                }
                return {
                    date: today,
                    moodLevel: null,
                    energyUnits: null,
                    brainMode: null,
                    burnoutFlags: [],
                    totalSpoons: 0,
                    remainingSpoons: 0,
                    quickBoostersUsed: [],
                    adjustments: {},
                    completedAt: null
                };
            });

            // Override Safety System state
            const [showOverrideModal, setShowOverrideModal] = useState(false);
            const [showWeeklyLimitModal, setShowWeeklyLimitModal] = useState(false);
            const [showCrisisModeModal, setShowCrisisModeModal] = useState(false);
            const [taskPendingOverride, setTaskPendingOverride] = useState(null);

            // Crisis Mode state
            const [crisisMode, setCrisisMode] = useState(() => {
                const stored = localStorage.getItem('ccCrisisMode');
                if (stored) {
                    try {
                        const crisis = JSON.parse(stored);
                        // Check if crisis should have auto-exited
                        const exitTime = new Date(crisis.autoExitAt);
                        if (new Date() >= exitTime) {
                            localStorage.removeItem('ccCrisisMode');
                            return { active: false };
                        }
                        return crisis;
                    } catch (e) {
                        return { active: false };
                    }
                }
                return { active: false };
            });

            // Spoon debt state
            const [spoonDebt, setSpoonDebt] = useState(() => {
                return calculateSpoonDebt();
            });

            const chatEndRef = useRef(null);

            // Load from localStorage on mount
            useEffect(() => {
                const savedKey = localStorage.getItem('calmCommanderApiKey');
                const savedMessages = localStorage.getItem('calmCommanderMessages');
                const savedTasks = localStorage.getItem('calmCommanderTasks');
                const savedMode = localStorage.getItem('calmCommanderMode');
                const savedEnergy = localStorage.getItem('ccDailyEnergy');
                const savedCompleted = localStorage.getItem('ccCompletedTasks');
                const savedCalendar = localStorage.getItem('ccCalendarInput');

                if (savedKey) {
                    setApiKey(savedKey);
                    setIsSetup(true);
                }
                if (savedMessages) {
                    setMessages(JSON.parse(savedMessages));
                }
                if (savedTasks) {
                    try {
                        const parsed = JSON.parse(savedTasks);
                        // Ensure it's an array
                        if (Array.isArray(parsed)) {
                            setTasks(parsed);
                        } else {
                            // Backup corrupted data before removing
                            console.error('⚠️ Tasks data is not an array, backing up to ccTasksBackup');
                            localStorage.setItem('ccTasksBackup', savedTasks);
                            setTasks([]);
                            localStorage.removeItem('calmCommanderTasks');
                        }
                    } catch (e) {
                        // Backup corrupted data before removing
                        console.error('⚠️ Tasks data is corrupted, backing up to ccTasksBackup', e);
                        localStorage.setItem('ccTasksBackup', savedTasks);
                        setTasks([]);
                        localStorage.removeItem('calmCommanderTasks');
                    }
                }
                if (savedMode) {
                    setCurrentMode(savedMode);
                }
                if (savedEnergy) {
                    const energy = JSON.parse(savedEnergy);
                    // Check if it's today's energy
                    if (energy.date === new Date().toDateString()) {
                        setDailyEnergy(energy);
                    }
                }
                if (savedCompleted) {
                    try {
                        const parsed = JSON.parse(savedCompleted);
                        if (Array.isArray(parsed)) {
                            setCompletedTasks(parsed);
                        }
                    } catch (e) {
                        setCompletedTasks([]);
                    }
                }
                if (savedCalendar) {
                    const calendar = JSON.parse(savedCalendar);
                    // Check if it's today's calendar
                    if (calendar.date === new Date().toDateString()) {
                        setCalendarInput(calendar.input);
                    }
                }

                // Add welcome message if first time
                if (!savedMessages && savedKey) {
                    const welcomeMsg = {
                        role: 'assistant',
                        content: "Hi there. I'm here to help you feel calmer and more clear. Let's take this one step at a time. What's on your mind right now?"
                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            }, []);

            // Auto-scroll chat only when new messages are added
            const prevMessageCount = useRef(0);
            useEffect(() => {
                // Only scroll if message count actually increased
                if (messages.length > prevMessageCount.current) {
                    chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                    prevMessageCount.current = messages.length;
                } else {
                    prevMessageCount.current = messages.length;
                }
            }, [messages]);

            // Save calendar input to localStorage when it changes
            useEffect(() => {
                if (calendarInput !== '') {
                    const calendar = {
                        date: new Date().toDateString(),
                        input: calendarInput
                    };
                    localStorage.setItem('ccCalendarInput', JSON.stringify(calendar));
                }
            }, [calendarInput]);

            const handleSetup = () => {
                if (apiKey.trim()) {
                    localStorage.setItem('calmCommanderApiKey', apiKey);
                    setIsSetup(true);

                    const welcomeMsg = {
                        role: 'assistant',
                        content: "Hi there. I'm here to help you feel calmer and more clear. Let's take this one step at a time. What's on your mind right now?"
                    };
                    setMessages([welcomeMsg]);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify([welcomeMsg]));
                }
            };

            // ============================================
            // AI ESTIMATION FUNCTIONS
            // ============================================

            // Estimate spoons required based on task title keywords
            const estimateSpoons = (title) => {
                const lowerTitle = title.toLowerCase();

                // 1 spoon - Simple, quick tasks
                const simpleKeywords = ['quick', 'simple', 'email', 'text', 'call', 'check', 'review', 'read', 'respond', 'reply', 'short'];
                if (simpleKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 1;
                }

                // 3 spoons - Complex tasks
                const complexKeywords = ['write', 'create', 'prepare', 'design', 'analyze', 'research', 'plan', 'organize', 'develop'];
                if (complexKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 3;
                }

                // 4 spoons - High-demand tasks
                const demandingKeywords = ['presentation', 'proposal', 'strategy', 'difficult', 'complex', 'major', 'important', 'critical'];
                if (demandingKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 4;
                }

                // 2 spoons - Default (routine tasks)
                return 2;
            };

            // Estimate time required based on task title keywords (returns minutes)
            const estimateTimeMinutes = (title) => {
                const lowerTitle = title.toLowerCase();

                // 15 minutes - Quick tasks
                const quickKeywords = ['quick', 'email', 'text', 'check', 'short', '5-min', '10-min'];
                if (quickKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 15;
                }

                // 30 minutes
                const halfHourKeywords = ['brief', 'quick call', 'standup', 'update', 'review'];
                if (halfHourKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 30;
                }

                // 2 hours
                const twoHourKeywords = ['write', 'prepare', 'create', 'design', 'develop'];
                if (twoHourKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 120;
                }

                // 3 hours - Major tasks
                const majorKeywords = ['proposal', 'presentation', 'strategy', 'report', 'analysis'];
                if (majorKeywords.some(keyword => lowerTitle.includes(keyword))) {
                    return 180;
                }

                // Look for explicit time mentions
                const timeMatch = lowerTitle.match(/(\d+)\s*(min|hour|hr)/i);
                if (timeMatch) {
                    const value = parseInt(timeMatch[1]);
                    const unit = timeMatch[2].toLowerCase();
                    if (unit.startsWith('min')) {
                        return value;
                    } else {
                        return value * 60; // Convert hours to minutes
                    }
                }

                // 1 hour - Default
                return 60;
            };

            // Convert energy level to spoons (for backward compatibility)
            const energyToSpoons = (energyRequired) => {
                const mapping = {
                    'low': 1,
                    'medium': 2,
                    'high': 3
                };
                return mapping[energyRequired] || 2;
            };

            // Calculate timeframe from due date
            const getTimeframeFromDueDate = (dueDate) => {
                if (!dueDate) return null;

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const due = new Date(dueDate);
                due.setHours(0, 0, 0, 0);
                const daysUntil = Math.ceil((due - today) / (1000 * 60 * 60 * 24));

                if (daysUntil <= 0) return 'today';           // Overdue or today
                if (daysUntil <= 7) return 'this-week';       // Within a week
                if (daysUntil <= 14) return 'next-week';      // Next week
                if (daysUntil <= 30) return 'this-month';     // This month
                return 'later';                               // Future
            };

            // Adjust spoons based on focus level required
            const adjustSpoonsForFocusLevel = (baseSpoons, focusLevel) => {
                const focusMultiplier = {
                    'high': 1.5,    // High focus = 50% more spoons
                    'medium': 1.0,  // Default
                    'low': 0.75     // Low focus = 25% fewer spoons
                };
                return Math.ceil(baseSpoons * (focusMultiplier[focusLevel] || 1.0));
            };

            // Task management functions
            const addTask = (title, category = 'Uncategorized', energyRequired = 'medium', view = 'later', client = '', billable = false, estimatedTime = null, priority = 'medium', urgency = 'normal', focusLevel = 'medium', waitingFor = '', dueDate = '') => {
                // AI estimate spoons and time if not provided
                const baseSpoons = estimateSpoons(title);
                const adjustedSpoons = adjustSpoonsForFocusLevel(baseSpoons, focusLevel);
                const estimatedMinutes = estimatedTime !== null ? estimatedTime : estimateTimeMinutes(title);

                // Auto-calculate timeframe from due date if provided
                const calculatedView = dueDate ? getTimeframeFromDueDate(dueDate) : view;

                const newTask = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    energyRequired: energyRequired,
                    spoonsRequired: adjustedSpoons,  // NEW: AI-estimated spoons adjusted for focus level
                    estimatedTime: estimatedMinutes,  // Time in minutes
                    priority: priority,  // NEW: low/medium/high
                    urgency: urgency,  // NEW: critical/important/normal/low
                    focusLevel: focusLevel,  // NEW: high/medium/low
                    waitingFor: waitingFor,  // NEW: dependency tracking
                    dueDate: dueDate,  // NEW: due date for auto-promotion
                    view: calculatedView || view,
                    client: client,
                    billable: billable,
                    status: 'active',
                    createdDate: Date.now(),
                    subtasks: []  // NEW: support subtasks
                };
                // Ensure tasks is always an array
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = [...currentTasks, newTask];
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const deleteTask = (taskId) => {
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const moveTask = (taskId, newView) => {
                const updatedTasks = tasks.map(t =>
                    t.id === taskId ? { ...t, view: newView } : t
                );
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const completeTask = (taskId, actualTime, skipOverrideCheck = false) => {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                const spoonsRequired = task.spoonsRequired || 2;

                // Override detection: Check if task needs more spoons than available
                // Skip if: in crisis mode OR override already approved OR no spoons tracking
                if (!skipOverrideCheck &&
                    !crisisMode.active &&
                    dailyCapacity.totalSpoons > 0 &&
                    spoonsRequired > dailyCapacity.remainingSpoons) {

                    // Check weekly override limit
                    const weekOverrideCount = getWeekOverrideCount();
                    if (weekOverrideCount >= OVERRIDE_CONFIG.maxPerWeek) {
                        // Hit weekly limit - show limit modal
                        setTaskPendingOverride(task);
                        setShowWeeklyLimitModal(true);
                        return;
                    } else {
                        // Show override modal
                        setTaskPendingOverride(task);
                        setShowOverrideModal(true);
                        return;
                    }
                }

                // Deduct spoons from daily capacity (can go negative in crisis mode or after override)
                if (dailyCapacity && dailyCapacity.totalSpoons > 0 && task.spoonsRequired) {
                    const updatedCapacity = {
                        ...dailyCapacity,
                        remainingSpoons: dailyCapacity.remainingSpoons - task.spoonsRequired
                    };
                    setDailyCapacity(updatedCapacity);
                    localStorage.setItem(`calm-neuro-check-${updatedCapacity.date}`, JSON.stringify(updatedCapacity));

                    // Update debt tracking
                    if (updatedCapacity.remainingSpoons < 0) {
                        const newDebt = {
                            date: new Date().toISOString().split('T')[0],
                            debtAmount: updatedCapacity.remainingSpoons,
                            daysInDebt: spoonDebt.daysInDebt + 1
                        };
                        setSpoonDebt(newDebt);
                        localStorage.setItem('ccSpoonDebt', JSON.stringify(newDebt));
                    }
                }

                // Create completed task with time data
                const completedTask = {
                    ...task,
                    status: 'completed',
                    completedDate: Date.now(),
                    actualTime: actualTime,
                    completedInCrisis: crisisMode.active || false
                };

                // Track crisis mode completions
                if (crisisMode.active) {
                    const updatedCrisis = {
                        ...crisisMode,
                        tasksCompletedInCrisis: [...(crisisMode.tasksCompletedInCrisis || []), taskId]
                    };
                    setCrisisMode(updatedCrisis);
                    localStorage.setItem('ccCrisisMode', JSON.stringify(updatedCrisis));
                }

                // Remove from active tasks
                const updatedTasks = tasks.filter(t => t.id !== taskId);
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Add to completed tasks
                const updatedCompleted = [...completedTasks, completedTask];
                setCompletedTasks(updatedCompleted);
                localStorage.setItem('ccCompletedTasks', JSON.stringify(updatedCompleted));

                // Close modal
                setShowCompleteModal(false);
                setTaskToComplete(null);
            };

            // Crisis Mode activation
            const activateCrisisMode = (reason) => {
                const now = new Date();
                const exitDate = new Date(now);
                exitDate.setDate(exitDate.getDate() + 1);
                exitDate.setHours(OVERRIDE_CONFIG.crisisAutoExitHour, 0, 0, 0);

                const crisisData = {
                    active: true,
                    activatedAt: now.toISOString(),
                    reason,
                    autoExitAt: exitDate.toISOString(),
                    debtAtStart: dailyCapacity.remainingSpoons,
                    tasksCompletedInCrisis: []
                };

                setCrisisMode(crisisData);
                localStorage.setItem('ccCrisisMode', JSON.stringify(crisisData));
            };

            // Deactivate Crisis Mode
            const deactivateCrisisMode = () => {
                setCrisisMode({ active: false });
                localStorage.removeItem('ccCrisisMode');
            };

            // Handle override confirmation (from Override Modal)
            const handleOverrideConfirm = (taskId) => {
                // Complete the task, skipping override check since it's already approved
                completeTask(taskId, null, true);
            };

            // ============================================
            // INLINE TASK EDITING FUNCTIONS
            // ============================================

            const updateTaskAttribute = (taskId, attribute, value) => {
                const updatedTasks = tasks.map(t => {
                    if (t.id === taskId) {
                        const updates = { [attribute]: value };

                        // When focus level changes, recalculate spoons
                        if (attribute === 'focusLevel') {
                            const baseSpoons = estimateSpoons(t.title);
                            updates.spoonsRequired = adjustSpoonsForFocusLevel(baseSpoons, value);
                        }

                        // When due date changes, auto-update timeframe
                        if (attribute === 'dueDate') {
                            const newTimeframe = getTimeframeFromDueDate(value);
                            if (newTimeframe) {
                                updates.view = newTimeframe;
                            }
                        }

                        return { ...t, ...updates };
                    }
                    return t;
                });
                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
            };

            const updateCompletedTask = (taskId, attribute, value) => {
                const updatedCompleted = completedTasks.map(t =>
                    t.id === taskId ? { ...t, [attribute]: value } : t
                );
                setCompletedTasks(updatedCompleted);
                localStorage.setItem('ccCompletedTasks', JSON.stringify(updatedCompleted));
            };

            const formatTimeDisplay = (minutes) => {
                if (minutes < 60) {
                    return `${minutes}m`;
                } else {
                    const hours = Math.floor(minutes / 60);
                    const mins = minutes % 60;
                    if (mins === 0) {
                        return `${hours}h`;
                    } else {
                        return `${hours}h ${mins}m`;
                    }
                }
            };

            // Export all data to JSON file
            const exportData = () => {
                const today = new Date().toISOString().split('T')[0];
                const exportData = {
                    exportDate: new Date().toISOString(),
                    version: '3.0-NEUROCHECK',
                    data: {
                        tasks: tasks,
                        completedTasks: completedTasks,
                        dailyCapacity: dailyCapacity,
                        apiKey: apiKey,
                        messages: messages,
                        currentMode: currentMode,
                        dailyEnergy: dailyEnergy,
                        calendarInput: calendarInput,
                        crisisMode: crisisMode,
                        spoonDebt: spoonDebt,
                        // Get all neuro-check data
                        neuroCheckHistory: Object.keys(localStorage)
                            .filter(key => key.startsWith('calm-neuro-check-'))
                            .map(key => ({
                                key: key,
                                data: JSON.parse(localStorage.getItem(key))
                            })),
                        // Get override log
                        overrideLog: JSON.parse(localStorage.getItem('ccOverrideLog') || '{"overrides":[]}'),
                        // Get backup if exists
                        backup: localStorage.getItem('ccTasksBackup')
                    }
                };

                const dataStr = JSON.stringify(exportData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `calm-commander-backup-${today}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                alert(`✅ Data exported!\n\nFile: calm-commander-backup-${today}.json\n\nThis includes:\n• ${tasks.length} active tasks\n• ${completedTasks.length} completed tasks\n• Neuro-check history\n• Override log\n• All settings\n\nKeep this file safe for billing records!`);
            };

            // Import data from JSON file
            const importData = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importedData = JSON.parse(event.target.result);

                            if (!importedData.data) {
                                alert('❌ Invalid backup file format');
                                return;
                            }

                            const confirmed = confirm(
                                `⚠️ Import Data from ${importedData.exportDate}?\n\n` +
                                `This will restore:\n` +
                                `• ${importedData.data.tasks?.length || 0} active tasks\n` +
                                `• ${importedData.data.completedTasks?.length || 0} completed tasks\n` +
                                `• Neuro-check history\n` +
                                `• All settings\n\n` +
                                `Current data will be REPLACED. Continue?`
                            );

                            if (!confirmed) return;

                            // Restore all data
                            if (importedData.data.tasks) {
                                setTasks(importedData.data.tasks);
                                localStorage.setItem('calmCommanderTasks', JSON.stringify(importedData.data.tasks));
                            }
                            if (importedData.data.completedTasks) {
                                setCompletedTasks(importedData.data.completedTasks);
                                localStorage.setItem('ccCompletedTasks', JSON.stringify(importedData.data.completedTasks));
                            }
                            if (importedData.data.dailyCapacity) {
                                setDailyCapacity(importedData.data.dailyCapacity);
                                const date = importedData.data.dailyCapacity.date;
                                localStorage.setItem(`calm-neuro-check-${date}`, JSON.stringify(importedData.data.dailyCapacity));
                            }
                            if (importedData.data.messages) {
                                setMessages(importedData.data.messages);
                                localStorage.setItem('calmCommanderMessages', JSON.stringify(importedData.data.messages));
                            }
                            if (importedData.data.currentMode) {
                                setCurrentMode(importedData.data.currentMode);
                                localStorage.setItem('calmCommanderMode', importedData.data.currentMode);
                            }
                            if (importedData.data.dailyEnergy) {
                                setDailyEnergy(importedData.data.dailyEnergy);
                                localStorage.setItem('ccDailyEnergy', JSON.stringify(importedData.data.dailyEnergy));
                            }
                            if (importedData.data.calendarInput) {
                                setCalendarInput(importedData.data.calendarInput);
                                localStorage.setItem('ccCalendarInput', JSON.stringify(importedData.data.calendarInput));
                            }
                            if (importedData.data.crisisMode) {
                                setCrisisMode(importedData.data.crisisMode);
                                if (importedData.data.crisisMode.active) {
                                    localStorage.setItem('ccCrisisMode', JSON.stringify(importedData.data.crisisMode));
                                }
                            }
                            if (importedData.data.spoonDebt) {
                                setSpoonDebt(importedData.data.spoonDebt);
                                localStorage.setItem('ccSpoonDebt', JSON.stringify(importedData.data.spoonDebt));
                            }
                            // Restore neuro-check history
                            if (importedData.data.neuroCheckHistory) {
                                importedData.data.neuroCheckHistory.forEach(item => {
                                    localStorage.setItem(item.key, JSON.stringify(item.data));
                                });
                            }
                            // Restore override log
                            if (importedData.data.overrideLog) {
                                localStorage.setItem('ccOverrideLog', JSON.stringify(importedData.data.overrideLog));
                            }

                            alert('✅ Data imported successfully!\n\nAll your tasks, billing data, and settings have been restored.');

                            // Refresh page to ensure everything loads correctly
                            window.location.reload();
                        } catch (error) {
                            alert(`❌ Error importing data:\n${error.message}\n\nPlease check the file and try again.`);
                            console.error('Import error:', error);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const setEnergy = (level) => {
                const energy = {
                    date: new Date().toDateString(),
                    level: level,
                    timestamp: Date.now()
                };
                setDailyEnergy(energy);
                localStorage.setItem('ccDailyEnergy', JSON.stringify(energy));
            };

            const handleBulkUpload = () => {
                if (!bulkUploadText.trim()) return;

                // Parse text into individual tasks
                const lines = bulkUploadText.split('\n');
                const newTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    // Skip empty lines and very short entries
                    if (trimmed && trimmed.length > 2) {
                        // Remove common prefixes like bullets, numbers, checkboxes
                        let taskText = trimmed
                            .replace(/^[-•*]\s*/, '')  // Remove bullet points
                            .replace(/^\d+[\.)]\s*/, '')  // Remove numbered lists
                            .replace(/^[\[\(]?\s*[xX\s]?\s*[\]\)]?\s*/, '')  // Remove checkboxes
                            .trim();

                        if (taskText && taskText.length > 2) {
                            newTasks.push({
                                id: Date.now() + Math.random(),
                                title: taskText,
                                category: 'Bulk Upload',
                                energyRequired: 'medium',
                                spoonsRequired: estimateSpoons(taskText),  // AI estimation
                                estimatedTime: estimateTimeMinutes(taskText),  // AI estimation
                                priority: 'medium',
                                view: 'later',  // Brain dump location
                                client: bulkUploadClient.trim(),
                                billable: bulkUploadBillable,
                                status: 'active',
                                createdDate: Date.now(),
                                subtasks: []
                            });
                        }
                    }
                });

                if (newTasks.length > 0) {
                    const currentTasks = Array.isArray(tasks) ? tasks : [];
                    const updatedTasks = [...currentTasks, ...newTasks];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                    // Close modal and reset
                    setShowBulkUploadModal(false);
                    setBulkUploadText('');
                    setBulkUploadClient('');
                    setBulkUploadBillable(false);
                }
            };

            const handleBreakdownTask = async (task) => {
                setTaskToBreakdown(task);
                setShowBreakdownModal(true);
                setIsBreakingDown(true);
                setBreakdownSubtasks([]);

                try {
                    const breakdownPrompt = `I have a task that feels overwhelming: "${task.title}"

Please break this down into 3-5 smaller, concrete steps that I can do one at a time. Make each step:
- Specific and actionable
- Small enough to complete in one sitting
- Clear about what "done" looks like

Format your response as a simple numbered list, one step per line.`;

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: breakdownPrompt,
                            mode: 'coach',
                            apiKey: apiKey
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Parse the AI response to extract subtasks
                        const lines = data.response.split('\n');
                        const subtasks = [];

                        lines.forEach(line => {
                            const trimmed = line.trim();
                            // Match numbered lists like "1. ", "1) ", or bullet points
                            const match = trimmed.match(/^(?:\d+[\.)]\s*|[-•*]\s*)(.+)$/);
                            if (match && match[1] && match[1].length > 3) {
                                subtasks.push(match[1].trim());
                            }
                        });

                        setBreakdownSubtasks(subtasks);
                    } else {
                        setBreakdownSubtasks(['Error: Could not get breakdown from AI']);
                    }
                } catch (error) {
                    setBreakdownSubtasks(['Error: Failed to connect to AI']);
                }

                setIsBreakingDown(false);
            };

            const addSubtasksToList = () => {
                if (breakdownSubtasks.length === 0 || !taskToBreakdown) return;

                // Mark parent task as having subtasks
                const updatedParent = {
                    ...taskToBreakdown,
                    hasSubtasks: true,
                    subtaskCount: breakdownSubtasks.length
                };

                // Add each subtask with link to parent
                // If parent has estimate, divide it among subtasks
                const subtaskEstimate = taskToBreakdown.estimatedTime
                    ? taskToBreakdown.estimatedTime / breakdownSubtasks.length
                    : null;

                const newSubtasks = breakdownSubtasks.map((subtaskTitle, index) => ({
                    id: Date.now() + Math.random() + index,
                    title: subtaskTitle,
                    category: taskToBreakdown.category || 'Uncategorized',
                    energyRequired: taskToBreakdown.energyRequired || 'medium',
                    view: taskToBreakdown.view || 'later',
                    client: taskToBreakdown.client || '',
                    billable: taskToBreakdown.billable || false,
                    estimatedTime: subtaskEstimate,
                    parentTaskId: taskToBreakdown.id,
                    status: 'active',
                    createdDate: Date.now()
                }));

                // Update tasks: replace parent with updated parent, add all subtasks
                const currentTasks = Array.isArray(tasks) ? tasks : [];
                const updatedTasks = currentTasks.map(t =>
                    t.id === taskToBreakdown.id ? updatedParent : t
                ).concat(newSubtasks);

                setTasks(updatedTasks);
                localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));

                // Expand parent by default
                setExpandedParents({...expandedParents, [taskToBreakdown.id]: true});

                // Close modal
                setShowBreakdownModal(false);
                setTaskToBreakdown(null);
                setBreakdownSubtasks([]);
            };

            const detectCrisisMode = (text) => {
                const lowerText = text.toLowerCase();
                return CRISIS_KEYWORDS.some(keyword => lowerText.includes(keyword));
            };

            const parseCalendarInput = (input) => {
                if (!input || !input.trim()) return 0;

                let totalBusyHours = 0;
                const text = input.toLowerCase();

                // Match explicit hours like "3 hours", "3 hrs", "3h"
                const explicitHoursMatch = text.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\s+(?:in|of|for)?\s*(?:meetings?|calls?)?/gi);
                if (explicitHoursMatch) {
                    explicitHoursMatch.forEach(match => {
                        const hours = parseFloat(match.match(/(\d+(?:\.\d+)?)/)[1]);
                        totalBusyHours += hours;
                    });
                }

                // Match time ranges like "2-3pm", "9:30-11am", "2pm-4pm"
                const timeRangeRegex = /(\d{1,2})(?::(\d{2}))?\s*(?:am|pm)?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi;
                const timeRanges = text.matchAll(timeRangeRegex);

                for (const match of timeRanges) {
                    let startHour = parseInt(match[1]);
                    const startMin = match[2] ? parseInt(match[2]) : 0;
                    let endHour = parseInt(match[3]);
                    const endMin = match[4] ? parseInt(match[4]) : 0;
                    const period = match[5];

                    // Convert to 24-hour format
                    if (period === 'pm' && endHour !== 12) endHour += 12;
                    if (period === 'am' && endHour === 12) endHour = 0;
                    if (period === 'pm' && startHour < 12 && startHour < endHour - 12) startHour += 12;
                    if (period === 'am' && startHour === 12) startHour = 0;

                    const durationHours = (endHour + endMin / 60) - (startHour + startMin / 60);
                    if (durationHours > 0 && durationHours < 12) {
                        totalBusyHours += durationHours;
                    }
                }

                // Match individual hour mentions like "2pm", "3:30pm" (count as 1 hour each)
                if (totalBusyHours === 0) {
                    const singleTimes = text.match(/(?:^|[,;])\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)/gi);
                    if (singleTimes) {
                        totalBusyHours = singleTimes.length * 1; // Assume 1 hour per meeting mentioned
                    }
                }

                return Math.min(totalBusyHours, 16); // Cap at 16 hours to avoid nonsense
            };

            const parseTasks = (responseText) => {
                // Simple task parsing for Step 1
                // Just extract tasks that AI mentions with emoji markers
                const lines = responseText.split('\n');
                const foundTasks = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    // Look for task markers
                    if (trimmed.startsWith('✅') || trimmed.startsWith('⏳') || trimmed.startsWith('📅')) {
                        const taskText = trimmed.replace(/^[✅⏳📅💬]\s*/, '').replace(/now:|soon:|later:|do now:|delay:|ask for help:/i, '').trim();
                        if (taskText && taskText.length > 3) {
                            foundTasks.push(taskText);
                        }
                    }
                });

                // Add found tasks to master list
                if (foundTasks.length > 0) {
                    const newTaskObjects = foundTasks.map(taskText => ({
                        id: Date.now() + Math.random(),
                        title: taskText,
                        category: 'From AI',
                        status: 'active',
                        createdDate: Date.now()
                    }));
                    const updatedTasks = [...tasks, ...newTaskObjects];
                    setTasks(updatedTasks);
                    localStorage.setItem('calmCommanderTasks', JSON.stringify(updatedTasks));
                }
            };

            const switchMode = (newMode, isAuto = false) => {
                if (newMode !== currentMode) {
                    setCurrentMode(newMode);
                    localStorage.setItem('calmCommanderMode', newMode);

                    const modeMsg = {
                        role: 'system',
                        content: isAuto
                            ? `Switching to ${newMode} mode. I'm here...`
                            : `Switched to ${newMode} mode.`
                    };
                    const updatedMessages = [...messages, modeMsg];
                    setMessages(updatedMessages);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));
                }
            };

            const sendMessage = async () => {
                if (!inputMessage.trim() || isLoading) return;

                const userMsg = { role: 'user', content: inputMessage };
                const updatedMessages = [...messages, userMsg];
                setMessages(updatedMessages);
                localStorage.setItem('calmCommanderMessages', JSON.stringify(updatedMessages));

                // Check for manual mode switch requests
                const lowerInput = inputMessage.toLowerCase();
                if (lowerInput.includes('back to normal mode') || lowerInput.includes('coach mode')) {
                    switchMode('coach');
                } else if (detectCrisisMode(inputMessage)) {
                    switchMode('crisis', true);
                }

                setInputMessage('');
                setIsLoading(true);

                // Build context about current tasks and state
                let context = '';

                // Add energy level if set today
                if (dailyEnergy && dailyEnergy.level) {
                    context += `\n\nCurrent energy level: ${dailyEnergy.level}\n`;
                }

                // Add calendar info if entered
                if (calendarInput && calendarInput.trim()) {
                    const busyHours = parseCalendarInput(calendarInput);
                    context += `\nCalendar today: ${calendarInput} (${busyHours.toFixed(1)}h in meetings/calls)\n`;
                }

                // Add active tasks grouped by view
                const activeTasks = tasks.filter(t => !completedTasks.some(ct => ct.id === t.id));

                if (activeTasks.length > 0) {
                    context += `\n--- CURRENT TASK LIST (${activeTasks.length} tasks) ---\n`;

                    const todayTasks = activeTasks.filter(t => t.view === 'today');
                    const thisWeekTasks = activeTasks.filter(t => t.view === 'thisweek');
                    const laterTasks = activeTasks.filter(t => t.view === 'later');

                    if (todayTasks.length > 0) {
                        context += `\nToday (${todayTasks.length}):\n`;
                        todayTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (thisWeekTasks.length > 0) {
                        context += `\nThis Week (${thisWeekTasks.length}):\n`;
                        thisWeekTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            if (t.client) taskLine += ` [${t.client}]`;
                            context += taskLine + '\n';
                        });
                    }

                    if (laterTasks.length > 0) {
                        context += `\nLater (${laterTasks.length}):\n`;
                        laterTasks.forEach(t => {
                            let taskLine = `- ${t.title}`;
                            if (t.estimatedTime) taskLine += ` [est: ${t.estimatedTime}h]`;
                            if (t.energyRequired) taskLine += ` (${t.energyRequired} energy)`;
                            context += taskLine + '\n';
                        });
                    }
                    context += '--- END TASK LIST ---\n';
                }

                // Combine user message with context
                const messageWithContext = inputMessage + context;

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: messageWithContext,
                            mode: currentMode,
                            apiKey: apiKey
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const assistantMsg = { role: 'assistant', content: data.response };
                        const finalMessages = [...updatedMessages, assistantMsg];
                        setMessages(finalMessages);
                        localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));

                        // Parse tasks from response
                        parseTasks(data.response);
                    } else {
                        const errorMsg = {
                            role: 'system',
                            content: `Error: ${data.error || 'Failed to get response'}`
                        };
                        const finalMessages = [...updatedMessages, errorMsg];
                        setMessages(finalMessages);
                        localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));
                    }
                } catch (error) {
                    const errorMsg = {
                        role: 'system',
                        content: 'Connection error. Please check your internet and try again.'
                    };
                    const finalMessages = [...updatedMessages, errorMsg];
                    setMessages(finalMessages);
                    localStorage.setItem('calmCommanderMessages', JSON.stringify(finalMessages));
                }

                setIsLoading(false);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            if (!isSetup) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>Calm Commander</h1>
                        </div>
                        <div className="content">
                            <div className="setup-screen">
                                <h2>Welcome to Calm Commander</h2>
                                <p>An AI coach designed specifically for people with ADHD and autism.</p>

                                <div className="info-box">
                                    Get your API key at console.anthropic.com. It stays private on your device.
                                </div>

                                <div className="input-group">
                                    <label htmlFor="apiKey">Anthropic API Key</label>
                                    <input
                                        id="apiKey"
                                        type="password"
                                        value={apiKey}
                                        onChange={(e) => setApiKey(e.target.value)}
                                        placeholder="sk-ant-..."
                                        onKeyPress={(e) => e.key === 'Enter' && handleSetup()}
                                    />
                                </div>

                                <button className="btn-primary" onClick={handleSetup}>
                                    Start Using Calm Commander
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>Calm Commander</h1>
                        <div className={`mode-badge ${currentMode}`}>
                            {currentMode === 'coach' ? '🧘 Coach Mode' : '🚨 Crisis Mode'}
                        </div>
                        {crisisMode.active && (
                            <div className="mt-2 p-2 bg-red-100 border-2 border-red-500 rounded-lg text-center">
                                <div className="font-bold text-red-900">🚨 SPOON OVERRIDE MODE ACTIVE</div>
                                <div className="text-sm text-red-700">All limits removed until tomorrow {OVERRIDE_CONFIG.crisisAutoExitHour}:00 AM</div>
                                <button
                                    onClick={deactivateCrisisMode}
                                    className="mt-2 px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700"
                                >
                                    Exit Crisis Mode Early
                                </button>
                            </div>
                        )}
                        <div className="mode-buttons">
                            <button
                                className={`mode-btn coach ${currentMode === 'coach' ? 'active' : ''}`}
                                onClick={() => switchMode('coach')}
                            >
                                Coach Mode
                            </button>
                            <button
                                className={`mode-btn crisis ${currentMode === 'crisis' ? 'active' : ''}`}
                                onClick={() => switchMode('crisis')}
                            >
                                Crisis Mode
                            </button>
                            {!crisisMode.active && (
                                <button
                                    onClick={() => setShowCrisisModeModal(true)}
                                    className="mode-btn px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm"
                                >
                                    Activate Override Mode
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="content">
                        {/* Spoon Debt Display */}
                        {dailyCapacity.remainingSpoons < 0 && (
                            <div className="mb-4 p-4 bg-red-50 border-2 border-red-400 rounded-lg">
                                <div className="font-bold text-red-900">⚠️ Starting today with {Math.abs(dailyCapacity.remainingSpoons)} spoon debt from yesterday</div>
                                <div className="text-sm text-red-700 mt-1">
                                    Tomorrow will start with: {spoonDebt.debtAmount < 0 ? `${spoonDebt.debtAmount} spoon debt` : `${spoonDebt.debtAmount} spoons`}
                                </div>
                            </div>
                        )}

                        {/* 48-Hour Debt Pattern Alert */}
                        {spoonDebt.daysInDebt >= 2 && spoonDebt.daysInDebt < 5 && (
                            <div className="mb-4 p-4 bg-amber-50 border-2 border-amber-400 rounded-lg">
                                <div className="font-bold text-amber-900">⚠️ Pattern Alert: {spoonDebt.daysInDebt} Days in Debt</div>
                                <div className="text-sm text-amber-800 mt-2">
                                    You've been operating below capacity for {spoonDebt.daysInDebt} consecutive days.
                                </div>
                                <div className="text-sm text-amber-700 mt-2">
                                    <strong>Common causes:</strong> Overcommitting, underestimating task demands, not using recovery strategies, crisis that hasn't ended.
                                </div>
                                <div className="flex gap-2 mt-3">
                                    <button
                                        onClick={() => window.open('sms:')}
                                        className="px-3 py-2 bg-amber-600 text-white rounded text-sm hover:bg-amber-700"
                                    >
                                        Schedule Check-in with Holly
                                    </button>
                                    <button
                                        onClick={() => {
                                            const log = JSON.parse(localStorage.getItem('ccOverrideLog') || '{"overrides":[]}');
                                            const thisWeek = log.overrides.filter(o => o.weekNumber === getISOWeek(new Date()));
                                            alert(`This Week's Overrides:\n\n${thisWeek.map(o => `${o.taskName} (${o.reason})`).join('\n')}`);
                                        }}
                                        className="px-3 py-2 bg-amber-500 text-white rounded text-sm hover:bg-amber-600"
                                    >
                                        Review This Week's Overrides
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 5-Day Burnout Alert */}
                        {spoonDebt.daysInDebt >= 5 && (
                            <div className="mb-4 p-4 bg-red-100 border-4 border-red-600 rounded-lg">
                                <div className="font-bold text-red-900 text-lg">🚨 BURNOUT ALERT</div>
                                <div className="text-red-800 mt-2">
                                    You've been in spoon debt for {spoonDebt.daysInDebt} days. This is not sustainable. Your body needs recovery time or you'll crash.
                                </div>
                                <div className="bg-white p-3 rounded mt-3 border-2 border-red-400">
                                    <div className="font-semibold text-red-900 mb-2">REQUIRED ACTIONS:</div>
                                    <div className="text-sm text-red-800">Tomorrow will auto-suggest as RECOVERY DAY</div>
                                </div>
                                <div className="text-sm text-red-900 mt-3 font-medium">
                                    You must pick one:
                                </div>
                                <div className="flex flex-col gap-2 mt-2">
                                    <button
                                        onClick={() => alert('Recovery day scheduled for tomorrow')}
                                        className="px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-left"
                                    >
                                        Clear my calendar tomorrow
                                    </button>
                                    <button
                                        onClick={() => window.open('sms:')}
                                        className="px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-left"
                                    >
                                        Talk to Holly about what's happening
                                    </button>
                                    <button
                                        onClick={() => {
                                            const acknowledged = confirm('I acknowledge I\'m heading for shutdown and will take recovery action tomorrow.');
                                            if (acknowledged) {
                                                // Log acknowledgment
                                                alert('Acknowledged. Please honor this commitment to yourself.');
                                            }
                                        }}
                                        className="px-3 py-2 bg-red-700 text-white rounded hover:bg-red-800 text-left"
                                    >
                                        Acknowledge I'm heading for shutdown
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Spoon Counter / Neuro-Check Panel */}
                        {dailyCapacity.totalSpoons > 0 ? (
                            <div className="mb-4 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg border-2 border-purple-200">
                                <div className="flex justify-between items-center">
                                    <div
                                        className="cursor-pointer"
                                        onClick={() => {
                                            const breakdown = dailyCapacity.adjustments || {};
                                            const boostersUsed = dailyCapacity.quickBoostersUsed || [];
                                            const boosterSpoons = boostersUsed.length;
                                            alert(
                                                `🥄 Your Spoon Breakdown:\n\n` +
                                                `• Started with: ${breakdown.original_energy || dailyCapacity.energyUnits} spoons (from energy check)\n` +
                                                `• Brain mode: ${breakdown.brain_mode_adjustment || 0} spoons (${dailyCapacity.brainMode})\n` +
                                                `• Burnout: ${breakdown.burnout_adjustment || 0} spoons (${dailyCapacity.burnoutFlags?.length || 0} flags)\n` +
                                                `• Boosters used: +${boosterSpoons} spoons (${boostersUsed.length} boosters)\n` +
                                                `• Spent on tasks: -${(dailyCapacity.totalSpoons + (breakdown.brain_mode_adjustment || 0) + (breakdown.burnout_adjustment || 0)) - dailyCapacity.remainingSpoons - boosterSpoons} spoons\n\n` +
                                                `= ${dailyCapacity.remainingSpoons} spoons remaining`
                                            );
                                        }}
                                        title="Click to see your spoon breakdown"
                                    >
                                        <div className="text-3xl mb-1">
                                            {'🥄 '.repeat(Math.max(0, Math.min(10, dailyCapacity.remainingSpoons)))}
                                            {dailyCapacity.totalSpoons - dailyCapacity.remainingSpoons > 0 && (
                                                <span className="opacity-30">
                                                    {'🥄 '.repeat(Math.max(0, Math.min(10, dailyCapacity.totalSpoons - dailyCapacity.remainingSpoons)))}
                                                </span>
                                            )}
                                        </div>
                                        <p className="text-sm text-gray-700 font-medium">
                                            {dailyCapacity.remainingSpoons}/{dailyCapacity.totalSpoons} spoons remaining
                                            <span className="ml-2 text-purple-500">ℹ️</span>
                                        </p>
                                        <p className="text-xs text-gray-500 mt-1">
                                            Mood: {dailyCapacity.moodLevel}/10 •
                                            Brain: {dailyCapacity.brainMode}
                                            {dailyCapacity.burnoutFlags && dailyCapacity.burnoutFlags.length > 0 &&
                                                ` • ${dailyCapacity.burnoutFlags.length} burnout flag${dailyCapacity.burnoutFlags.length > 1 ? 's' : ''}`
                                            }
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowNeuroCheck(true)}
                                        className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold hover:bg-purple-700 transition-colors"
                                    >
                                        Refresh
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="mb-4 p-4 bg-yellow-50 border-2 border-yellow-300 rounded-lg">
                                <div className="flex items-start gap-3">
                                    <span className="text-2xl">👋</span>
                                    <div className="flex-1">
                                        <h3 className="font-semibold text-gray-900 mb-1">
                                            Start Your Day with a Neuro-Check
                                        </h3>
                                        <p className="text-sm text-gray-700 mb-3">
                                            Track your energy with Spoon Theory - helps us plan realistically and avoid overwhelm.
                                        </p>
                                        <button
                                            onClick={() => setShowNeuroCheck(true)}
                                            className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold hover:bg-purple-700 transition-colors"
                                        >
                                            Do Neuro-Check (2 min)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Quick Spoon Boosters - Only show if neuro-check done */}
                        {dailyCapacity.totalSpoons > 0 && (
                            <div className="mb-4">
                                <div className="bg-blue-50 border-2 border-blue-200 rounded-lg p-4">
                                    <h3 className="text-sm font-semibold text-gray-900 mb-3 flex items-center gap-2">
                                        <span>⚡</span>
                                        <span>Quick Spoon Boosters</span>
                                        <span className="text-xs text-gray-500 font-normal">
                                            (use once per day each)
                                        </span>
                                    </h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {QUICK_BOOSTERS.map(booster => {
                                            const alreadyUsed = dailyCapacity.quickBoostersUsed &&
                                                               dailyCapacity.quickBoostersUsed.includes(booster.id);
                                            return (
                                                <button
                                                    key={booster.id}
                                                    onClick={() => {
                                                        if (alreadyUsed) return;

                                                        const updated = {
                                                            ...dailyCapacity,
                                                            remainingSpoons: dailyCapacity.remainingSpoons + booster.spoons,
                                                            totalSpoons: dailyCapacity.totalSpoons + booster.spoons,
                                                            quickBoostersUsed: [...(dailyCapacity.quickBoostersUsed || []), booster.id]
                                                        };

                                                        localStorage.setItem(
                                                            `calm-neuro-check-${updated.date}`,
                                                            JSON.stringify(updated)
                                                        );

                                                        setDailyCapacity(updated);
                                                    }}
                                                    disabled={alreadyUsed}
