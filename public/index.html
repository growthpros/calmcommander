<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm Commander - AuDHD Edition v3.0-NEUROCHECK</title>
    <!-- VERSION: 3.0-NEUROCHECK - If you see this, new code loaded! -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        console.log('%c🎯 CALM COMMANDER v3.0-NEUROCHECK LOADED', 'background: purple; color: white; font-size: 16px; padding: 10px;');
        console.log('✅ If you see this message, the NEW version with Neuro-Check is loaded!');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .mode-badge.coach {
            background: #d1fae5;
            color: #065f46;
        }

        .mode-badge.crisis {
            background: #fee2e2;
            color: #991b1b;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.coach {
            background: #22c55e;
            color: white;
        }

        .mode-btn.coach:hover {
            background: #16a34a;
        }

        .mode-btn.coach.active {
            border-color: #065f46;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            transform: scale(1.02);
        }

        .mode-btn.crisis {
            background: #ef4444;
            color: white;
        }

        .mode-btn.crisis:hover {
            background: #dc2626;
        }

        .mode-btn.crisis.active {
            border-color: #991b1b;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
            transform: scale(1.02);
        }

        .content {
            padding: 30px;
        }

        .setup-screen {
            text-align: center;
            padding: 20px;
        }

        .setup-screen h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .setup-screen p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .info-box {
            background: #f0f9ff;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #1e40af;
            font-size: 14px;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .chat-container {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user {
            background: #e0e7ff;
            color: #1e1b4b;
            margin-left: 20px;
        }

        .message.assistant {
            background: white;
            color: #333;
            margin-right: 20px;
            border: 1px solid #e5e7eb;
        }

        .message.system {
            background: #fef3c7;
            color: #78350f;
            text-align: center;
            font-style: italic;
            margin: 10px 40px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .tasks-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .tasks-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .task-category {
            margin-bottom: 20px;
        }

        .task-category h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #f9fafb;
            border-left: 4px solid;
            border-radius: 4px;
            font-size: 14px;
        }

        .task-item.now {
            border-left-color: #22c55e;
        }

        .task-item.soon {
            border-left-color: #fbbf24;
        }

        .task-item.later {
            border-left-color: #94a3b8;
        }

        .empty-state {
            color: #9ca3af;
            font-style: italic;
            padding: 10px 12px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .header, .content {
                padding: 20px;
            }

            .chat-container {
                height: 300px;
            }

            .message.user {
                margin-left: 10px;
            }

            .message.assistant {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // REUSABLE UI COMPONENTS
        // ============================================

        // Card Component
        const Card = ({ children, className = '', ...props }) => (
            <div className={`bg-white rounded-lg shadow-sm border border-gray-200 ${className}`} {...props}>
                {children}
            </div>
        );

        const CardHeader = ({ children, className = '' }) => (
            <div className={`px-6 py-4 border-b border-gray-200 ${className}`}>
                {children}
            </div>
        );

        const CardContent = ({ children, className = '' }) => (
            <div className={`px-6 py-4 ${className}`}>
                {children}
            </div>
        );

        // Badge Component
        const Badge = ({ children, variant = 'default', className = '' }) => {
            const variants = {
                default: 'bg-gray-100 text-gray-700',
                primary: 'bg-blue-100 text-blue-700',
                success: 'bg-green-100 text-green-700',
                warning: 'bg-yellow-100 text-yellow-700',
                danger: 'bg-red-100 text-red-700',
                purple: 'bg-purple-100 text-purple-700'
            };

            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]} ${className}`}>
                    {children}
                </span>
            );
        };

        // Button Component
        const Button = ({ children, variant = 'default', size = 'md', className = '', ...props }) => {
            const variants = {
                default: 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50',
                primary: 'bg-blue-500 text-white hover:bg-blue-600',
                success: 'bg-green-500 text-white hover:bg-green-600',
                danger: 'bg-red-500 text-white hover:bg-red-600',
                ghost: 'bg-transparent hover:bg-gray-100'
            };

            const sizes = {
                sm: 'px-3 py-1.5 text-sm',
                md: 'px-4 py-2 text-base',
                lg: 'px-6 py-3 text-lg'
            };

            return (
                <button
                    className={`rounded-lg font-medium transition-colors ${variants[variant]} ${sizes[size]} ${className}`}
                    {...props}
                >
                    {children}
                </button>
            );
        };

        // Modal Component
        const Modal = ({ isOpen, onClose, children, title }) => {
            if (!isOpen) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ background: 'rgba(0, 0, 0, 0.5)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                        onClick={(e) => e.stopPropagation()}
                    >
                        {title && (
                            <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                                <h2 className="text-xl font-semibold text-gray-900">{title}</h2>
                                <button
                                    onClick={onClose}
                                    className="text-gray-400 hover:text-gray-600 text-2xl leading-none"
                                >
                                    ×
                                </button>
                            </div>
                        )}
                        <div className="px-6 py-4">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================
        // NEURO-CHECK MODAL COMPONENT
        // ============================================

        const NeuroCheckModal = ({ isOpen, onClose, onComplete }) => {
            const [moodLevel, setMoodLevel] = useState(5);
            const [energyUnits, setEnergyUnits] = useState(5);
            const [brainMode, setBrainMode] = useState('Normal');
            const [selectedBurnout, setSelectedBurnout] = useState([]);
            const [calculatedSpoons, setCalculatedSpoons] = useState(null);
            const [showResult, setShowResult] = useState(false);

            if (!isOpen) return null;

            const handleCalculate = () => {
                const result = calculateDailyCapacity(energyUnits, brainMode, selectedBurnout);
                setCalculatedSpoons(result.final_capacity);

                const capacityData = {
                    date: new Date().toISOString().split('T')[0],
                    moodLevel,
                    energyUnits,
                    brainMode,
                    burnoutFlags: selectedBurnout,
                    totalSpoons: result.final_capacity,
                    remainingSpoons: result.final_capacity,
                    quickBoostersUsed: [],
                    adjustments: result,
                    completedAt: new Date().toISOString()
                };

                localStorage.setItem(
                    `calm-neuro-check-${capacityData.date}`,
                    JSON.stringify(capacityData)
                );

                setShowResult(true);
                onComplete(capacityData);
            };

            const toggleBurnout = (indicatorId) => {
                setSelectedBurnout(prev =>
                    prev.includes(indicatorId)
                        ? prev.filter(id => id !== indicatorId)
                        : [...prev, indicatorId]
                );
            };

            const getMoodEmoji = (level) => {
                if (level <= 3) return '😢';
                if (level <= 6) return '😐';
                if (level <= 8) return '🙂';
                return '😊';
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ background: 'rgba(0, 0, 0, 0.5)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                            <h2 className="text-xl font-semibold text-gray-900">Daily Neuro-Check</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl leading-none"
                            >
                                ×
                            </button>
                        </div>

                        <div className="px-6 py-4">
                            {!showResult ? (
                                <>
                                    <p className="text-gray-600 mb-6">
                                        Let's figure out your spoon capacity for today. This helps us plan realistically.
                                    </p>

                                    {/* Mood Level Slider */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Mood Level (for tracking patterns)
                                        </label>
                                        <div className="flex items-center gap-4">
                                            <span className="text-4xl">{getMoodEmoji(moodLevel)}</span>
                                            <div className="flex-1">
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="10"
                                                    value={moodLevel}
                                                    onChange={(e) => setMoodLevel(parseInt(e.target.value))}
                                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600"
                                                />
                                                <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                    <span>1 (low)</span>
                                                    <span className="font-semibold text-purple-600">{moodLevel}/10</span>
                                                    <span>10 (high)</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Energy Units Slider */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Energy Units (Spoons You Woke Up With)
                                            <span
                                                className="ml-2 text-blue-500 cursor-help"
                                                title="This determines your daily spoon capacity. Different from mood - it's about energy/executive function, not emotions."
                                            >
                                                ℹ️
                                            </span>
                                        </label>
                                        <div className="flex items-center gap-4">
                                            <span className="text-4xl">{'🥄'.repeat(Math.max(1, energyUnits))}</span>
                                            <div className="flex-1">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="10"
                                                    value={energyUnits}
                                                    onChange={(e) => setEnergyUnits(parseInt(e.target.value))}
                                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                                />
                                                <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                    <span>0 (depleted)</span>
                                                    <span className="font-semibold text-blue-600">{energyUnits} spoons</span>
                                                    <span>10 (full)</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Brain Mode Selector */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Brain Mode
                                            <span
                                                className="ml-2 text-purple-500 cursor-help"
                                                title="Fog = harder to focus, distracted (-2 spoons) | Shutdown = barely functioning (-4 spoons)"
                                            >
                                                ℹ️
                                            </span>
                                        </label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['Normal', 'Fog', 'Shutdown'].map(mode => (
                                                <button
                                                    key={mode}
                                                    onClick={() => setBrainMode(mode)}
                                                    className={`px-4 py-3 rounded-lg font-medium transition-all ${
                                                        brainMode === mode
                                                            ? 'bg-purple-600 text-white shadow-lg'
                                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    {mode}
                                                    {mode === 'Fog' && ' (-2)'}
                                                    {mode === 'Shutdown' && ' (-4)'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Burnout Indicators */}
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Burnout Indicators
                                            <span
                                                className="ml-2 text-amber-500 cursor-help"
                                                title="Checking 3+ indicators triggers protection mode (-3 spoons to prevent overcommitment and help you pace yourself)"
                                            >
                                                ℹ️
                                            </span>
                                            {selectedBurnout.length >= 3 && (
                                                <span className="ml-2 text-red-600 font-semibold">
                                                    (Protection mode: -3 spoons)
                                                </span>
                                            )}
                                        </label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {BURNOUT_INDICATORS.map(indicator => (
                                                <button
                                                    key={indicator.id}
                                                    onClick={() => toggleBurnout(indicator.id)}
                                                    className={`p-3 text-left rounded-lg transition-all ${
                                                        selectedBurnout.includes(indicator.id)
                                                            ? 'bg-red-100 border-2 border-red-400 shadow-sm'
                                                            : 'bg-gray-50 border-2 border-transparent hover:bg-gray-100'
                                                    }`}
                                                >
                                                    <div className="flex items-start gap-2">
                                                        <span className="text-xl">{indicator.icon}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="text-sm font-medium text-gray-900">
                                                                {indicator.label}
                                                            </div>
                                                            <div className="text-xs text-gray-500 mt-0.5">
                                                                {indicator.description}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                        {selectedBurnout.length >= 3 && (
                                            <div className="mt-3 p-3 bg-red-50 border-l-4 border-red-400 text-sm text-red-700">
                                                ⚠️ Multiple burnout indicators detected. Applying protection mode to prevent overcommitment.
                                            </div>
                                        )}
                                    </div>

                                    {/* Calculate Button */}
                                    <button
                                        onClick={handleCalculate}
                                        className="w-full bg-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors"
                                    >
                                        Calculate My Spoons
                                    </button>
                                </>
                            ) : (
                                /* Result Display */
                                <div className="text-center py-6">
                                    <div className="text-6xl mb-4">
                                        {'🥄 '.repeat(calculatedSpoons || 1)}
                                    </div>
                                    <h3 className="text-3xl font-bold text-gray-900 mb-2">
                                        {calculatedSpoons} spoons today
                                    </h3>
                                    <p className="text-gray-600 mb-6">
                                        Your daily capacity has been calculated and saved.
                                    </p>

                                    {/* Breakdown */}
                                    <div className="bg-gray-50 rounded-lg p-4 mb-6 text-left">
                                        <div className="text-sm font-medium text-gray-700 mb-2">Calculation:</div>
                                        <div className="space-y-1 text-sm text-gray-600">
                                            <div>Starting energy: {energyUnits} spoons</div>
                                            {brainMode !== 'Normal' && (
                                                <div>Brain mode ({brainMode}): {brainMode === 'Fog' ? '-2' : '-4'} spoons</div>
                                            )}
                                            {selectedBurnout.length >= 3 && (
                                                <div>Burnout protection: -3 spoons</div>
                                            )}
                                            <div className="pt-2 border-t border-gray-300 font-semibold text-gray-900">
                                                Final capacity: {calculatedSpoons} spoons
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => {
                                            onClose();
                                            setShowResult(false);
                                        }}
                                        className="w-full bg-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors"
                                    >
                                        Start My Day
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Override Modal Component
        const OverrideModal = ({ isOpen, onClose, task, remainingSpoons, onConfirm }) => {
            const [accountabilityChecked, setAccountabilityChecked] = useState(false);
            const [reason, setReason] = useState('');
            const [showError, setShowError] = useState(false);

            if (!isOpen || !task) return null;

            const spoonsRequired = task.spoonsRequired || 2;
            const debtIncurred = spoonsRequired - remainingSpoons;
            const weekOverrideCount = getWeekOverrideCount();

            const handleComplete = () => {
                if (!accountabilityChecked) {
                    setShowError(true);
                    return;
                }
                if (reason.length < OVERRIDE_CONFIG.minReasonLength) {
                    setShowError(true);
                    return;
                }

                // Log override
                const overrideLog = JSON.parse(localStorage.getItem('ccOverrideLog') || '{"overrides":[]}');
                const overrideEntry = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    weekNumber: getISOWeek(new Date()),
                    taskId: task.id,
                    taskName: task.title,
                    spoonsRequired,
                    spoonsAvailable: remainingSpoons,
                    debtIncurred,
                    reason,
                    accountabilityTexted: accountabilityChecked,
                    timestamp: new Date().toISOString()
                };
                overrideLog.overrides.push(overrideEntry);
                localStorage.setItem('ccOverrideLog', JSON.stringify(overrideLog));

                onConfirm(task.id);
                setAccountabilityChecked(false);
                setReason('');
                setShowError(false);
                onClose();
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ background: 'rgba(0, 0, 0, 0.6)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-lg shadow-xl max-w-md w-full"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4 border-b border-gray-200 bg-amber-50">
                            <h2 className="text-xl font-semibold text-amber-900 flex items-center gap-2">
                                ⚠️ Spoon Debt Alert
                            </h2>
                        </div>

                        <div className="px-6 py-4 space-y-4">
                            <div className="bg-gray-50 rounded p-3 text-sm">
                                <div className="font-medium">Task: {task.title}</div>
                                <div className="mt-2 space-y-1 text-gray-600">
                                    <div>Required: <span className="font-semibold text-red-600">{spoonsRequired} spoons</span></div>
                                    <div>Available: <span className="font-semibold">{remainingSpoons} spoons</span></div>
                                    <div>Debt after: <span className="font-semibold text-red-600">-{debtIncurred} spoons</span></div>
                                </div>
                            </div>

                            <div className="bg-blue-50 border-l-4 border-blue-400 p-3">
                                <p className="font-medium text-blue-900 mb-2">BEFORE OVERRIDING:</p>
                                <p className="text-sm text-blue-800 mb-3">
                                    You must text {OVERRIDE_CONFIG.accountabilityContacts.join(' or ')}:
                                    <br/>

        // Helper: Get ISO week number (Sunday-Saturday)
        const getISOWeek = (date) => {
            const target = new Date(date);
            const dayNr = (target.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            const firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
                target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
            }
            return 1 + Math.ceil((firstThursday - target) / 604800000);
        };

        // Helper: Get current week's override count
        const getWeekOverrideCount = () => {
            const overrideLog = JSON.parse(localStorage.getItem('ccOverrideLog') || '{"overrides":[]}');
            const currentWeek = getISOWeek(new Date());
            return overrideLog.overrides.filter(o => o.weekNumber === currentWeek).length;

                'Fog': -2,
                'Shutdown': -4
            };
            const brainModeAdj = brainModeAdjustments[brainMode] || 0;
            capacity += brainModeAdj;

            // Burnout protection (3+ flags = -3 spoons)
            const burnoutAdj = burnoutFlags.length >= 3 ? -3 : 0;
            capacity += burnoutAdj;

            // Floor at 0
            const finalCapacity = Math.max(0, capacity);

            return {
                original_energy: energyUnits,
                brain_mode_adjustment: brainModeAdj,
                burnout_adjustment: burnoutAdj,
                final_capacity: finalCapacity
            };
